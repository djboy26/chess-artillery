function Billboard({ children, position }) {
  const ref = useRef();
  useFrame(({camera}) => { if(ref.current) ref.current.quaternion.copy(camera.quaternion); });
  return <group ref={ref} position={position}>{children}</group>;
}

/** Slim bar, shown only when it carries information: damaged, hovered or selected. */
function HealthBar({ p, force }) {
  const f = clamp(p.hp/p.maxHp, 0, 1);
  if (f >= 1 && !force) return null;
  const W=0.42, H=0.048;
  return (
    <Billboard position={[0, CONFIG.HEIGHT[p.type]+0.26, 0]}>
      <mesh geometry={GEO.bar} raycast={noPick} renderOrder={20} scale={[W+0.035,H+0.032,1]}>
        <meshBasicMaterial color="#05070a" transparent opacity={0.8} depthTest={false} depthWrite={false} />
      </mesh>
      <mesh geometry={GEO.bar} raycast={noPick} renderOrder={21}
            position={[-W*(1-f)/2,0,0]} scale={[Math.max(0.001,W*f),H,1]}>
        <meshBasicMaterial color={hpColor(f)} transparent depthTest={false} depthWrite={false} />
      </mesh>
    </Billboard>);
}

/** Under-piece ring: accent = loaded, gold arc = reloading, faint = no weapon yet. */
function StatusRing({ p, game }) {
  const w = weaponOf(p, game);
  const cooling = p.cooldown>0;
  const ready = !!w && !cooling;
  if (!w && !cooling) return null;
  const frac = cooling ? 1 - p.cooldown/(w?w.cooldown:CONFIG.WEAPONS[p.type].cooldown) : 1;
  const geo = cooling
    ? flatRing(0.335,0.355,48, Math.PI/2, Math.max(0.001, frac*Math.PI*2))
    : flatRing(0.335,0.355,48, 0, Math.PI*2);
  const cdTex = cooling ? textTex(String(p.cooldown), '#96700e') : null;
  return (
    <>
      {cooling && (
        <mesh geometry={flatRing(0.335,0.355,48,0,Math.PI*2)} raycast={noPick} renderOrder={2}
              rotation={[-Math.PI/2,0,0]} position={[0,0.013,0]}>
          <meshBasicMaterial color="#cbbda4" transparent opacity={0.45} depthWrite={false} />
        </mesh>)}
      <mesh geometry={geo} raycast={noPick} renderOrder={3} rotation={[-Math.PI/2,0,0]} position={[0,0.015,0]}>
        <meshBasicMaterial color={cooling?COL.gold:ready?COL.accent:'#b9a98e'}
          transparent opacity={cooling?0.7:ready?0.55:0.3} depthWrite={false} />
      </mesh>
      {cdTex && (
        <sprite position={[0.34, 0.16, 0.34]} scale={[0.30,0.11,1]} renderOrder={33}>
          <spriteMaterial map={cdTex} transparent depthTest={false} depthWrite={false} />
        </sprite>)}
    </>);
}

/**
 * Crests read as part of the piece, so they use the body colour. Only the small
 * jewellery (crown pips, king's cross) picks up the lighter trim.
 */
/*───────────────────────────────────────────────────────────────────────────
  WEAPONS YOU CAN SEE. Every piece visibly carries the gun it actually fires,
  and the barrel swings to the locked target while aiming. Purely cosmetic —
  CONFIG.HEIGHT and PIECE_RADIUS (the collision model) are untouched, so
  ballistics and cover are unchanged.
───────────────────────────────────────────────────────────────────────────*/

const WG = {
  // Chunky on purpose: at normal play distance anything thinner than ~0.05 world
  // units reads as a speck rather than a gun.
  barrelL:  new THREE.CylinderGeometry(0.050, 0.056, 0.58, 14),   // rook railgun
  barrelM:  new THREE.CylinderGeometry(0.046, 0.052, 0.48, 14),   // queen howitzer
  barrelS:  new THREE.CylinderGeometry(0.040, 0.044, 0.30, 12),   // pawn / king
  mortar:   new THREE.CylinderGeometry(0.078, 0.086, 0.34, 16),   // knight tube
  lens:     new THREE.CylinderGeometry(0.070, 0.046, 0.075, 18),  // bishop optic
  scope:    new THREE.CylinderGeometry(0.028, 0.028, 0.44, 12),   // bishop rail
  muzzle:   new THREE.CylinderGeometry(0.066, 0.066, 0.062, 14),
  mount:    new THREE.BoxGeometry(0.155, 0.085, 0.155),
  mag:      new THREE.BoxGeometry(0.082, 0.125, 0.05),
  strut:    new THREE.CylinderGeometry(0.019, 0.019, 0.22, 8),
  bead:     new THREE.SphereGeometry(0.034, 12, 10),
};

/** The gun a piece carries, mounted and aimed. */
const GUN_SCALE = 0.65;   // guns are cosmetic; smaller reads cleaner at play distance
function PieceWeapon({ p, game, aimYaw }) {
  const w = weaponOf(p, game);
  if (!w) return null;                    // unarmed king shows nothing
  const h = CONFIG.HEIGHT[p.type];
  const gun = <meshStandardMaterial color={COL.metal} roughness={0.34} metalness={0.72} />;
  const hot = <meshStandardMaterial color={w.tracer} roughness={0.3} metalness={0.4}
                emissive={w.tracer} emissiveIntensity={0.55} />;

  // Idle bearing: forward for most, the near diagonal for the pawn/bishop.
  const fwd = p.color === 'w' ? 0 : Math.PI;
  const idle = (p.type === 'p' || p.type === 'b') ? fwd + Math.PI/4 : fwd;
  const yaw = aimYaw != null ? aimYaw : idle;

  // `yaw` is measured from −z, but a group's Y rotation is measured from +z,
  // so the sign flips. Barrels are modelled along −z after a +90° X tilt.
  return (
    <group rotation={[0, -yaw, 0]}>
      {p.type === 'p' && (
        <group position={[0, h*0.80, 0]} scale={GUN_SCALE}>
          <mesh geometry={WG.mount} scale={[0.8,0.75,0.8]}>{gun}</mesh>
          <mesh geometry={WG.barrelS} position={[0, 0.015, -0.17]} rotation={[Math.PI/2,0,0]}>{gun}</mesh>
          <mesh geometry={WG.bead} position={[0, 0.015, -0.30]} scale={[0.7,0.7,0.7]}>{hot}</mesh>
        </group>)}

      {p.type === 'n' && (
        <group position={[0, h*0.62, 0]} scale={GUN_SCALE}>
          {/* mortar tube, canted up — it only ever lobs */}
          <mesh geometry={WG.mortar} position={[0, 0.13, -0.07]} rotation={[-0.95,0,0]}>{gun}</mesh>
          <mesh geometry={WG.muzzle} position={[0, 0.26, -0.16]} rotation={[-0.95,0,0]}>{hot}</mesh>
          <mesh geometry={WG.strut} position={[-0.10,-0.03,0.07]} rotation={[0.4,0,-0.35]}>{gun}</mesh>
          <mesh geometry={WG.strut} position={[ 0.10,-0.03,0.07]} rotation={[0.4,0, 0.35]}>{gun}</mesh>
        </group>)}

      {p.type === 'b' && (
        <group position={[0, h*0.60, 0]} scale={GUN_SCALE}>
          {/* long sniper rail + glowing optic */}
          <mesh geometry={WG.scope} position={[0, 0.04, -0.20]} rotation={[Math.PI/2,0,0]}>{gun}</mesh>
          <mesh geometry={WG.lens} position={[0, 0.04, -0.44]} rotation={[Math.PI/2,0,0]}>{hot}</mesh>
          <mesh geometry={WG.bead} position={[0, 0.125, -0.03]}>{hot}</mesh>
          <mesh geometry={WG.mount} scale={[0.65,0.6,0.95]} position={[0,-0.01,-0.02]}>{gun}</mesh>
        </group>)}

      {p.type === 'r' && (
        <group position={[0, h*0.70, 0]} scale={GUN_SCALE}>
          {/* heavy railgun through the tower */}
          <mesh geometry={WG.mount} position={[0,0,0.03]}>{gun}</mesh>
          <mesh geometry={WG.barrelL} position={[0, 0.005, -0.30]} rotation={[Math.PI/2,0,0]}>{gun}</mesh>
          <mesh geometry={WG.muzzle} position={[0, 0.005, -0.60]} rotation={[Math.PI/2,0,0]}>{hot}</mesh>
          {[-0.075,0.075].map((dx,i)=>(
            <mesh key={i} geometry={WG.strut} position={[dx,0.005,-0.18]}
                  rotation={[Math.PI/2,0,0]} scale={[1,1.3,1]}>{gun}</mesh>))}
        </group>)}

      {p.type === 'q' && (
        <group position={[0, h*0.66, 0]} scale={GUN_SCALE}>
          {/* howitzer on a turret ring, elevated */}
          <mesh geometry={WG.mount} scale={[1.25,0.9,1.25]}>{gun}</mesh>
          <mesh geometry={WG.barrelM} position={[0, 0.14, -0.20]} rotation={[-0.42,0,0]}>{gun}</mesh>
          <mesh geometry={WG.muzzle} position={[0, 0.245, -0.40]} rotation={[-0.42,0,0]}>{hot}</mesh>
          <mesh geometry={WG.strut} position={[0,-0.03,0.11]} rotation={[0.55,0,0]}>{gun}</mesh>
        </group>)}

      {p.type === 'k' && (
        <group position={[0, h*0.52, 0]} scale={GUN_SCALE}>
          {/* short last-stand piece, only exists once he is armed */}
          <mesh geometry={WG.mount} scale={[0.75,0.65,0.75]}>{gun}</mesh>
          <mesh geometry={WG.barrelS} position={[0, 0.02, -0.17]} rotation={[Math.PI/2,0,0]}>{gun}</mesh>
          <mesh geometry={WG.bead} position={[0, 0.02, -0.32]}>{hot}</mesh>
        </group>)}
    </group>);
}

function PieceCrest({ p, body, trim, rim }) {
  const h = CONFIG.HEIGHT[p.type];
  const bodyMat = <meshStandardMaterial color={body} roughness={p.color==='w'?0.44:0.40}
                    metalness={p.color==='w'?0.06:0.16} />;
  const trimMat = <meshStandardMaterial color={trim} roughness={0.34} metalness={0.34} />;

  if (p.type==='r') return (
    <group>{[0,1,2,3,4,5].map(i=>{
      const a=i/6*Math.PI*2;
      return <mesh key={i} geometry={GEO.batt}
        position={[Math.cos(a)*0.178, h+0.028, Math.sin(a)*0.178]} rotation={[0,-a,0]}>{bodyMat}</mesh>;})}
    </group>);

  if (p.type==='q') return (
    <group>{[0,1,2,3,4,5,6].map(i=>{
      const a=i/7*Math.PI*2;
      return <mesh key={i} geometry={GEO.pip}
        position={[Math.cos(a)*0.182, h*0.80, Math.sin(a)*0.182]}>{trimMat}</mesh>;})}
    </group>);

  if (p.type==='k') return (
    <group position={[0, h*0.885+0.058, 0]}>
      <mesh geometry={GEO.crossV}>{trimMat}</mesh>
      <mesh geometry={GEO.crossH} position={[0,0.024,0]}>{trimMat}</mesh>
    </group>);

  if (p.type==='n') {
    // The head is only readable in profile, and both players sit down the z axis —
    // so the nose points along x (White right, Black left), never at the camera.
    const rot = [0, p.color==='w' ? 0 : Math.PI, 0];
    return (<>
      <mesh geometry={KNIGHT_HEAD} position={[0, h*0.42, 0]} rotation={rot} raycast={noPick} scale={[1.07,1.06,1.16]}>
        <meshBasicMaterial color={rim} side={THREE.BackSide} /></mesh>
      <mesh geometry={KNIGHT_HEAD} position={[0, h*0.42, 0]} rotation={rot}>{bodyMat}</mesh>
    </>);
  }
  if (p.type==='b') return <mesh geometry={GEO.pip} position={[0, h*0.99, 0]}>{trimMat}</mesh>;
  return null;
}

function PieceMesh({ p, game, selected, hovered, eligible, dim, aimYaw, onPick, onHover }) {
  const [x,,z] = worldOf(p.sq);
  const body = p.color==='w' ? COL.wBody : COL.bBody;
  const trim = p.color==='w' ? COL.wTrim : COL.bTrim;
  const rim  = p.color==='w' ? COL.rimW  : COL.rimB;   // thin outline so the piece reads on any tile
  const glow = selected ? COL.accent : eligible ? '#8a4418' : '#000';
  return (
    <group position={[x,0,z]}
      onClick={(e)=>{e.stopPropagation(); onPick(p.id);}}
      onPointerOver={(e)=>{e.stopPropagation(); onHover(p.id,e);}}
      onPointerOut={(e)=>{e.stopPropagation(); onHover(null,e);}}>
      {/* inverted hull: a slightly larger back-face copy draws a thin rim around the silhouette */}
      <mesh geometry={GEO.body[p.type]} raycast={noPick} scale={[1.06,1.035,1.06]} position={[0,0.003,0]}>
        <meshBasicMaterial color={rim} side={THREE.BackSide} transparent={dim} opacity={dim?0.30:1} />
      </mesh>
      <mesh geometry={GEO.body[p.type]}>
        <meshStandardMaterial color={body} roughness={p.color==='w'?0.44:0.40}
          metalness={p.color==='w'?0.06:0.16}
          transparent={dim} opacity={dim?0.30:1}
          emissive={glow} emissiveIntensity={selected?0.5:eligible?0.42:0} />
      </mesh>
      <PieceCrest p={p} body={body} trim={trim} rim={rim} />
      <PieceWeapon p={p} game={game} aimYaw={aimYaw} />
      <StatusRing p={p} game={game} />
      {selected && (
        <mesh geometry={flatRing(0.40,0.455,48,0,Math.PI*2)} raycast={noPick} renderOrder={4}
              rotation={[-Math.PI/2,0,0]} position={[0,0.018,0]}>
          <meshBasicMaterial color={COL.accent} transparent opacity={0.9} depthWrite={false} />
        </mesh>)}
      <HealthBar p={p} force={selected||hovered} />
    </group>);
}

const Scorch = ({ s }) => (
  <mesh rotation={[-Math.PI/2,0,0]} position={[s.x,0.009,s.z]} raycast={noPick} renderOrder={1}>
    <circleGeometry args={[s.r,26]} />
    <meshBasicMaterial color="#7a6046" transparent opacity={0.30} depthWrite={false} />
  </mesh>);

/*═══════════════════════════════════════════════════════════════════════════
  12. CINEMATICS — muzzle flash, tracer, blast, damage numbers
═══════════════════════════════════════════════════════════════════════════*/

/** Cached canvas-texture sprites for floating damage numbers. */
const textTex = (() => {
  const cache = new Map();
  return (text, color) => {
    const key = text+'|'+color;
    if (cache.has(key)) return cache.get(key);
    const W=256,H=96, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const g=cv.getContext('2d');
    g.font='700 62px ui-sans-serif, system-ui, sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    // light board → pale halo behind dark text, not the other way round
    g.lineWidth=10; g.strokeStyle='rgba(255,252,245,.95)';
    g.strokeText(text,W/2,H/2);
    g.fillStyle=color; g.fillText(text,W/2,H/2);
    const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
    cache.set(key,t); return t;
  };
})();

function Floater({ e }) {
  const ref = useRef(); const t = useRef(0);
  const tex = useMemo(()=>textTex(e.text, e.color), [e.text, e.color]);
  useFrame((_,dt)=>{
    t.current += dt;
    const k = t.current/CONFIG.FX.floaterTime;
    if (!ref.current) return;
    if (k>=1){ ref.current.visible=false; return; }
    ref.current.position.set(e.x, e.y + CONFIG.FX.floaterRise*k, e.z);
    ref.current.material.opacity = k<0.65 ? 1 : 1-(k-0.65)/0.35;
  });
  return (
    <sprite ref={ref} position={[e.x,e.y,e.z]} scale={[0.62,0.23,1]} renderOrder={40}>
      <spriteMaterial map={tex} transparent depthTest={false} depthWrite={false} />
    </sprite>);
}

function MuzzleFlash({ e }) {
  const ref=useRef(), lt=useRef(); const t=useRef(0);
  useFrame((_,dt)=>{
    t.current+=dt;
    const k=clamp(1-t.current/CONFIG.FX.muzzleTime,0,1);
    if(ref.current){ ref.current.visible=k>0; ref.current.scale.setScalar(0.10+0.22*(1-k)); ref.current.material.opacity=k; }
    if(lt.current) lt.current.intensity = 6*k;
  });
  return (
    <group position={[e.x,e.y,e.z]}>
      <mesh ref={ref} geometry={GEO.ball} raycast={noPick} renderOrder={25}>
        <meshBasicMaterial color={e.color} transparent depthWrite={false} />
      </mesh>
      <pointLight ref={lt} color={e.color} distance={3.4} intensity={6} />
    </group>);
}

/** Impact: hot flash, expanding ground shockwave, tumbling debris, light pop, screen shake. */
function Blast({ e, shakeRef }) {
  const flash=useRef(), wave=useRef(), ring=useRef(), lt=useRef();
  const group=useRef();
  const t=useRef(0), kicked=useRef(false);
  const bits = useMemo(()=>{
    let s=(e.id*2654435761)>>>0;
    const rnd=()=>((s=(s*1103515245+12345)>>>0)/4294967296);
    return Array.from({length:CONFIG.FX.debrisCount},()=>{
      const a=rnd()*Math.PI*2, up=0.9+rnd()*2.4, sp=1.1+rnd()*2.6;
      return { v:[Math.cos(a)*sp, up, Math.sin(a)*sp], s:0.035+rnd()*0.055, spin:(rnd()-0.5)*14 };
    });
  },[e.id]);
  const bitRefs = useRef([]);

  useFrame((_,dt)=>{
    if (!kicked.current) {
      kicked.current = true;
      if (shakeRef) shakeRef.current.amp =
        Math.min(CONFIG.FX.shakeMax, shakeRef.current.amp + CONFIG.FX.shakeOnHit*e.power);
    }
    t.current += dt;
    const T=t.current, P=e.power;

    const fk = clamp(1-T/CONFIG.FX.flashTime,0,1);
    if (flash.current){ flash.current.visible=fk>0;
      flash.current.scale.setScalar(P*(0.16+0.30*(1-fk)));
      flash.current.material.opacity=fk; }
    if (lt.current) lt.current.intensity = CONFIG.FX.impactLight*P*fk;

    const wk = clamp(1-T/CONFIG.FX.waveTime,0,1);
    if (wave.current){ wave.current.visible=wk>0;
      const s=P*(0.22+0.85*(1-wk)); wave.current.scale.set(s,s,s);
      wave.current.material.opacity=wk*0.30; }
    if (ring.current){ ring.current.visible=wk>0;
      const s=P*(0.18+0.75*(1-wk)); ring.current.scale.set(s,s,s);
      ring.current.material.opacity=wk*0.8; }

    const dk = T/CONFIG.FX.debrisTime;
    bitRefs.current.forEach((m,i)=>{
      if(!m) return;
      if (dk>=1){ m.visible=false; return; }
      const b=bits[i], tt=T;
      m.position.set(e.x+b.v[0]*tt, Math.max(0.02, e.y+b.v[1]*tt-0.5*11*tt*tt), e.z+b.v[2]*tt);
      m.rotation.set(b.spin*tt, b.spin*0.7*tt, b.spin*0.4*tt);
      m.material.opacity = dk<0.6?1:1-(dk-0.6)/0.4;
    });
  });

  /* On a light board additive blending just turns everything white, so these use
     normal blending: a saturated fireball, then a dark dust ring and smoke puff. */
  return (
    <group ref={group}>
      <mesh ref={flash} geometry={GEO.ball} position={[e.x,e.y,e.z]} raycast={noPick} renderOrder={26}>
        <meshBasicMaterial color="#ff8a2b" transparent depthWrite={false} />
      </mesh>
      <mesh ref={wave} geometry={GEO.ball} position={[e.x,e.y,e.z]} raycast={noPick} renderOrder={24}>
        <meshBasicMaterial color="#9a7f63" transparent depthWrite={false} />
      </mesh>
      <mesh ref={ring} geometry={flatRing(0.72,1,64,0,Math.PI*2)} rotation={[-Math.PI/2,0,0]}
            position={[e.x,0.02,e.z]} raycast={noPick} renderOrder={25}>
        <meshBasicMaterial color="#7a5f45" transparent depthWrite={false} />
      </mesh>
      <pointLight ref={lt} position={[e.x,e.y+0.25,e.z]} color="#ffa64d" distance={6} intensity={0} />
      {bits.map((b,i)=>(
        <mesh key={i} ref={m=>bitRefs.current[i]=m} geometry={GEO.debris} raycast={noPick}
              position={[e.x,e.y,e.z]} scale={[b.s,b.s,b.s]}>
          <meshStandardMaterial color="#6f5741" roughness={0.95} transparent />
        </mesh>))}
    </group>);
}

/** Ballistic shell: bright core, additive halo, fading tracer, travelling light. */
function Projectile({ shot, onDone, shellRef }) {
  const head=useRef(), halo=useRef(), lt=useRef();
  const t=useRef(0), done=useRef(false);
  const line = useMemo(()=>{
    const geo=new THREE.BufferGeometry();
    const arr=new Float32Array(shot.pts.length*3);
    shot.pts.forEach((p,i)=>{arr[i*3]=p[0];arr[i*3+1]=p[1];arr[i*3+2]=p[2];});
    geo.setAttribute('position', new THREE.BufferAttribute(arr,3));
    geo.setDrawRange(0,0);
    const l=new THREE.Line(geo, new THREE.LineBasicMaterial({
      color:shot.color, transparent:true, opacity:0.9 }));
    l.frustumCulled=false; l.renderOrder=23; return l;
  },[shot]);

  useFrame((_,dt)=>{
    if (done.current) return;
    t.current += dt;
    const u = clamp(t.current/shot.duration,0,1);
    const idx = Math.min(shot.pts.length-1, Math.round(u*(shot.pts.length-1)));
    const p = shot.pts[idx];
    if (head.current) head.current.position.set(p[0],p[1],p[2]);
    if (halo.current){ halo.current.position.set(p[0],p[1],p[2]);
      halo.current.material.opacity = 0.55+0.25*Math.sin(t.current*40); }
    if (lt.current) lt.current.position.set(p[0],p[1],p[2]);
    if (shellRef) shellRef.current = p;
    const start = Math.max(0, idx-CONFIG.TRACER_POINTS);
    line.geometry.setDrawRange(start, idx-start+1);
    if (u>=1){ done.current=true; if(shellRef) shellRef.current=null; onDone(); }
  });

  return (
    <>
      <primitive object={line} />
      <mesh ref={halo} geometry={GEO.ball} position={shot.pts[0]} raycast={noPick} renderOrder={24}
            scale={[shot.size*2.4,shot.size*2.4,shot.size*2.4]}>
        <meshBasicMaterial color={shot.color} transparent opacity={0.28} depthWrite={false} />
      </mesh>
      <mesh ref={head} geometry={GEO.ball} position={shot.pts[0]} raycast={noPick} renderOrder={25}
            scale={[shot.size,shot.size,shot.size]}>
        <meshBasicMaterial color={shot.color} />
      </mesh>
      <pointLight ref={lt} color={shot.color} distance={3.2} intensity={CONFIG.FX.tracerLight} />
    </>);
}

/** Hitscan beam drawn as a stretched tube — WebGL ignores line width. */
function Beam({ shot, onDone }) {
  const t=useRef(0), done=useRef(false), core=useRef(), glow=useRef();
  const { mid, quat, len } = useMemo(()=>{
    const a=new THREE.Vector3(...shot.pts[0]);
    const b=new THREE.Vector3(...shot.pts[shot.pts.length-1]);
    const d=b.clone().sub(a);
    return { mid:a.clone().addScaledVector(d,0.5),
             quat:new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize()),
             len:Math.max(0.01,d.length()) };
  },[shot]);
  useFrame((_,dt)=>{
    if (done.current) return;
    t.current+=dt;
    const k=clamp(1-t.current/CONFIG.BEAM_LIFETIME_S,0,1);
    if(core.current) core.current.material.opacity=k;
    if(glow.current){ glow.current.material.opacity=k*0.35; glow.current.scale.set(1+(1-k)*1.6,1,1+(1-k)*1.6); }
    if(t.current>=CONFIG.BEAM_LIFETIME_S){ done.current=true; onDone(); }
  });
  return (
    <group position={mid} quaternion={quat}>
      <mesh ref={glow} raycast={noPick} renderOrder={23}>
        <cylinderGeometry args={[0.10,0.10,len,12,1,true]} />
        <meshBasicMaterial color={shot.color} transparent opacity={0.22}
          depthWrite={false} side={THREE.DoubleSide} />
      </mesh>
      <mesh ref={core} raycast={noPick} renderOrder={24}>
        <cylinderGeometry args={[0.030,0.030,len,10,1,true]} />
        <meshBasicMaterial color={shot.color} transparent
          depthWrite={false} side={THREE.DoubleSide} />
      </mesh>
    </group>);
}

/*═══════════════════════════════════════════════════════════════════════════
  13. AIMING OVERLAY  (absolute, cursor-driven — no accumulation, never stalls)
═══════════════════════════════════════════════════════════════════════════*/

/**
 * Aim overlay. Every square the weapon can reach is marked, and pre-resolved:
 * a filled dot means the shot gets through, a hollow cross means something is in
 * the way. Click one to lock it. No free-aim, no first-person view — where you
 * may shoot is simply drawn on the board.
 */
function TargetOverlay({ game, shooterId, targets, aimSq, hoverSq, assist }) {
  const spin = useRef();
  useFrame((_,dt)=>{ if (spin.current) spin.current.rotation.z += dt*0.5; });

  const locked = aimSq!=null ? targets.find(t=>t.sq===aimSq) : null;
  const shooter = game.pieces[shooterId];
  const isBeam = !!(weaponOf(shooter, game)||{}).hitscan;

  // assist mode: the true trajectory of the locked shot
  const arc = useMemo(()=>{
    if (!assist || !locked) return null;
    const pts = locked.sim.pts;
    const n = Math.min(400, pts.length), stride = pts.length/n;
    const v = [];
    for (let i=0;i<n;i++){
      const s=pts[Math.min(pts.length-1, Math.floor(i*stride))];
      v.push(new THREE.Vector3(s[0],s[1],s[2]));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(v);
    const l = new THREE.Line(geo, new THREE.LineDashedMaterial({
      color:COL.accent, transparent:true, opacity:0.7, dashSize:0.15, gapSize:0.11 }));
    l.computeLineDistances(); l.frustumCulled=false; l.renderOrder=22;
    return l;
  },[assist, locked]);

  return (
    <>
      {targets.map(t=>{
        const [x,,z]=worldOf(t.sq);
        const on = t.sq===aimSq, hov = t.sq===hoverSq;
        const clear = t.status==='clear';
        return (
          <group key={t.sq} position={[x,0.020,z]}>
            <mesh rotation={[-Math.PI/2,0,0]} raycast={noPick} renderOrder={5}>
              <circleGeometry args={[0.40,24]} />
              <meshBasicMaterial color={clear?COL.accent:'#8a7a66'} transparent
                opacity={on?0.34:hov?0.24:0.11} depthWrite={false} />
            </mesh>
            {clear ? (
              <mesh rotation={[-Math.PI/2,0,0]} position={[0,0.002,0]} raycast={noPick} renderOrder={6}>
                <circleGeometry args={[0.085,16]} />
                <meshBasicMaterial color={COL.accent} transparent opacity={0.95} depthWrite={false} />
              </mesh>
            ) : (
              <mesh rotation={[-Math.PI/2,0,0]} position={[0,0.002,0]} raycast={noPick} renderOrder={6}>
                <ringGeometry args={[0.145,0.185,4]} />
                <meshBasicMaterial color="#8a7a66" transparent opacity={0.8} depthWrite={false} />
              </mesh>
            )}
          </group>);
      })}

      {/* the blocker for the locked shot, called out on the board */}
      {locked && locked.blockerId && game.pieces[locked.blockerId] && (()=>{
        const [bx,,bz]=worldOf(game.pieces[locked.blockerId].sq);
        return (
          <mesh position={[bx,0.023,bz]} rotation={[-Math.PI/2,0,0]} raycast={noPick} renderOrder={8}>
            <ringGeometry args={[0.42,0.48,32]} />
            <meshBasicMaterial color={COL.red} transparent opacity={0.95} depthWrite={false} />
          </mesh>);
      })()}

      {/* locked reticle */}
      {locked && (()=>{
        const [x,,z]=worldOf(locked.sq);
        return (
          <group position={[x,0.030,z]}>
            <mesh ref={spin} rotation={[-Math.PI/2,0,0]} raycast={noPick} renderOrder={30}>
              <ringGeometry args={[0.30,0.365,4]} />
              <meshBasicMaterial color={locked.status==='clear'?COL.red:'#8a7a66'}
                transparent depthTest={false} depthWrite={false} />
            </mesh>
          </group>);
      })()}

      {/* a beam sweeps a lane, so show the lane rather than a single impact point */}
      {locked && isBeam && (()=>{
        const [sx,,sz]=worldOf(shooter.sq);
        return (
          <group position={[sx,0,sz]} rotation={[0,-locked.sol.yaw,0]}>
            <mesh position={[0,0.025,-6.5]} rotation={[-Math.PI/2,0,0]} raycast={noPick} renderOrder={7}>
              <planeGeometry args={[0.16,13]} />
              <meshBasicMaterial color={COL.red} transparent opacity={0.35} depthWrite={false} />
            </mesh>
          </group>);
      })()}

      {arc && <primitive object={arc} />}
    </>);
}

/*═══════════════════════════════════════════════════════════════════════════
  14. CAMERA
═══════════════════════════════════════════════════════════════════════════*/

/**
 * One camera for the whole game: an orbiting board view. There is deliberately no
 * first-person aiming view — you aim by clicking squares, so the board must stay
 * legible at all times.
 */
function CameraRig({ orbitRef, shakeRef }) {
  const { camera } = useThree();
  const tgt = useRef(new THREE.Vector3(0,0,0));
  const dp  = useRef(new THREE.Vector3());
  const dt2 = useRef(new THREE.Vector3());
  useFrame((_,delta)=>{
    {
      const o=orbitRef.current, sp=Math.sin(o.polar);
      dp.current.set(Math.sin(o.az)*sp*o.dist, Math.cos(o.polar)*o.dist, Math.cos(o.az)*sp*o.dist);
      dt2.current.set(0,0.2,0);
      camera.position.lerp(dp.current, CONFIG.CAM.lerp);
      tgt.current.lerp(dt2.current, CONFIG.CAM.lerp);
    }
    if (shakeRef) {
      const s = shakeRef.current;
      if (s.amp > 0.0005) {
        camera.position.x += (Math.random()-0.5)*s.amp;
        camera.position.y += (Math.random()-0.5)*s.amp*0.7;
        camera.position.z += (Math.random()-0.5)*s.amp;
        s.amp = Math.max(0, s.amp - s.amp*CONFIG.FX.shakeDecay*delta - 0.0004);
      } else s.amp = 0;
    }
    camera.lookAt(tgt.current);
  });
  return null;
}

  useEffect(()=>{ window.CA3 = three; }, [three]);

function Scene({ game, selectedId, hoverId, hints, fireState, targets, aimSq, hoverSq, themeName,
                 orbitRef, shakeRef, shot, onSquare, onPick, onHover, onTileHover, onShotDone }) {
  const sel = selectedId ? game.pieces[selectedId] : null;
  const shooter = fireState ? game.pieces[fireState.shooterId] : null;
  return (
    <>
      <color attach="background" args={[COL.bg]} />
      <fog attach="fog" args={[COL.bg, 19, 46]} />
      <hemisphereLight args={[LIT.sky, LIT.ground, LIT.hemi]} />
      <ambientLight intensity={LIT.amb} />
      <directionalLight position={[6,13,8]} intensity={LIT.dir} />
      <directionalLight position={[-8,7,-6]} intensity={LIT.fill} color={LIT.fillCol} />

      <DebugHook />
      <CameraRig orbitRef={orbitRef} shakeRef={shakeRef} />
      <Board onSquare={onSquare} onTileHover={onTileHover} hints={hints} themeName={themeName}
             selSq={sel?sel.sq:-1} lastMove={game.lastMoveSquares} />

      {game.scorch.map((s,i)=><Scorch key={'sc'+i} s={s} />)}

      {Object.values(game.pieces).map(p=>(
        <PieceMesh key={p.id} p={p} game={game}
          aimYaw={shooter && p.id===shooter.id && aimSq!=null
            ? (targets.find(t=>t.sq===aimSq)||{}).sol?.yaw : null}
          selected={selectedId===p.id} hovered={hoverId===p.id}
          eligible={!fireState && canFire(game,p)}
          dim={!!fireState && p.id!==(shooter&&shooter.id)}
          onPick={onPick} onHover={onHover} />))}

      {shooter && !shot && (
        <TargetOverlay game={game} shooterId={shooter.id} targets={targets}
                       aimSq={aimSq} hoverSq={hoverSq} assist={game.settings.assistMode} />)}

      {game.fx.map(e =>
        e.kind==='blast'  ? <Blast key={e.id} e={e} shakeRef={shakeRef} /> :
        e.kind==='muzzle' ? <MuzzleFlash key={e.id} e={e} /> :
        e.kind==='float'  ? <Floater key={e.id} e={e} /> : null)}

      {shot && (shot.beam
        ? <Beam key={shot.key} shot={shot} onDone={onShotDone} />
        : <Projectile key={shot.key} shot={shot} onDone={onShotDone} />)}
    </>);
}

            <h4>The eight rules</h4>
            <ul>
              <li><b>1.</b> Normal chess. Normal board, normal moves, normal draws.</li>

              <li><b>3.</b> Guns are cold until both sides have made <b>{CONFIG.GUNS_LIVE_AFTER_MOVES} moves</b>.
                The opening is pure chess.</li>
              <li><b>4.</b> Firing puts that piece on <b>cooldown</b> for a few turns. That is the

              <li><b>5.</b> Everything has HP: {TYPES.map(t=>`${NAME[t].toLowerCase()} ${CONFIG.HP[t]}`).join(', ')}.

              <li><b>6.</b> Capturing kills instantly, but your capturing piece <b>takes the

              <li><b>7.</b> <b>Check is a free shot.</b> Every piece giving check automatically

              <li><b>8.</b> Win by checkmate, or by draining the king to 0 HP.</li>

            <h4 style={{marginTop:18}}>Aiming</h4>
            <ul>
              <li>Press <kbd>F</kbd>. Every square that weapon can reach lights up.</li>
              <li><b>Filled dot</b> = the shot gets through. <b>Hollow diamond</b> = blocked, and

              <li>Blocked by your own piece? Switch to <b>LOB</b> (<kbd>Tab</kbd>) and watch the

            <h4>Weapons — chess principles as guns</h4>

              <li><b>♗ Bishop · Sniper.</b> Instant hitscan beam, unlimited range, pierces
                everything in line. <b>Locked to its colour complex</b> — a light-squared bishop
                simply cannot hurt anything on a dark square. <b>×2</b> from a fianchetto
                (b2/g2/b7/g7). <b>+25%</b> while you keep the bishop pair. Each further body in the
                beam takes {Math.round(B.BISHOP_PIERCE_FALLOFF*100)}% of the last. {CONFIG.WEAPONS.b.damage} base.</li>
              <li><b>♘ Knight · Fork Gun.</b> Lobs over everything, cover is irrelevant. The shell
                <b> splits and hits the two nearest enemies</b> within {B.KNIGHT_PRONG_RADIUS} squares.
                <b> ×2</b> on an outpost (opponent's 5th/6th rank). <b>×0.5</b> on the a- or h-file,
                because a knight on the rim is dim. Second prong at {Math.round(B.KNIGHT_PRONG_FALLOFF*100)}%.
                Cannot fire closer than {CONFIG.WEAPONS.n.minRange} squares — close it down and its gun is dead.
                {CONFIG.WEAPONS.n.damage} base per prong.</li>
              <li><b>♖ Rook · Railgun.</b> Flat and fast, blocked by the first thing in the way.
                Damage is driven by <b>your file</b>: blocked ×0.5, half-open ×1, <b>fully open ×2</b>.
                <b>+50%</b> on the 7th rank. <b>Battery:</b> two rooks doubled on a line fire as one
                combined shot — and both go on cooldown. {CONFIG.WEAPONS.r.damage} base.</li>
              <li><b>♕ Queen · Artillery.</b> Big lobbed shell, {CONFIG.WEAPONS.q.damage} + {CONFIG.WEAPONS.q.splashDamage} splash, range {CONFIG.WEAPONS.q.maxRange}. <b>Half
                damage before move {B.QUEEN_EARLY_UNTIL}</b> — don't bring her out early. Biggest

              <li><b>♙ Pawn · Chain Gun.</b> Weak alone. <b>×2 when defended by another pawn.</b>

  useEffect(()=>{ if(mvRef.current) mvRef.current.scrollTop = mvRef.current.scrollHeight; },[game.moveList.length]);

  const check = inCheck(game, game.turn);
  const stale = false;
  const moveDone = !!ts.movedId;
  const shotState = ts.firedId ? 'ok' : ts.forfeited ? 'skip' : 'open';

  return (
    <div className="rail">

      </section>

              <tr key={m.n}><td className="n">{m.n}.</td><td>{m.w}</td><td>{m.b||''}</td></tr>))}

function bootGame() {
  const st = newGame({
    captureDamage: CONFIG.CAPTURE_DAMAGE_DEFAULT,
    friendlyFire:  CONFIG.FRIENDLY_FIRE_DEFAULT,
    assistMode:    CONFIG.ASSIST_MODE_DEFAULT,
    sound:         CONFIG.SOUND_DEFAULT,
    shotClock:     CONFIG.SHOT_CLOCK_DEFAULT,
    autoFlip:      CONFIG.AUTO_FLIP_DEFAULT,
    checkShots:    CONFIG.CHECK_SHOTS_DEFAULT,
  });
  beginTurn(st);
  return st;
}

/** Plain-language answer to "why can't this piece shoot?" */
function fireBlockReason(st, p) {
  if (!p) return null;
  if (p.color !== st.turn)          return 'It belongs to the other player.';
  if (!gunsLive(st)) return `Guns are cold until both sides have made ${CONFIG.GUNS_LIVE_AFTER_MOVES} moves.`;
  if (!weaponOf(p, st)) return p.type==='k'
    ? `The king arms himself only once both sides are down to ${CONFIG.KING_ARMS_AT_PIECES} pieces.`
    : 'This piece has no weapon.';
  if (st.turnState.firedId)         return 'You have already fired this turn.';
  if (st.turnState.forfeited)       return 'The shot clock ran out this turn.';
  if (st.turnState.movedId === p.id)return 'This is the piece you moved this turn.';
  if (p.cooldown > 0)               return `Reloading — ready in ${p.cooldown} of your turn${p.cooldown>1?'s':''}.`;
  return null;
}

function App() {
  const [game, setGame]           = useState(bootGame);
  const [selectedId, setSelected] = useState(null);
  const [fireState, setFireState] = useState(null);
  const [shot, setShot]           = useState(null);
  const [hover, setHover]         = useState(null);
  const [clock, setClock]         = useState(CONFIG.SHOT_CLOCK_SECONDS);
  const [promo, setPromo]         = useState(null);
  const [arcPref, setArcPref]     = useState('flat');
  const [showRules, setRules]     = useState(true);
  const [showSet, setSet]         = useState(false);
  const [aimSq, setAimSq]         = useState(null);   // locked target square
  const [theme, setTheme]         = useState(() => {
    try { const t = localStorage.getItem('ca-theme'); if (THEMES[t]) return t; } catch(e){}
    return 'ivory';
  });
  const [denied, setDenied]       = useState(null);   // "why can't this fire" note

  const orbitRef = useRef({ az:0, polar:CONFIG.CAM.polar, dist:CONFIG.CAM.dist });
  const histRef  = useRef([]);          // one snapshot per ply, for Undo
  const snapPly  = useRef(-1);
  const [toast, setToast] = useState(null);
  const shakeRef = useRef({ amp:0 });
  const orbiting = useRef(false);
  const firing   = useRef(false);
  const pendSim  = useRef(null);
  const stageRef = useRef();

  const mutate = useCallback(fn => setGame(g => { const n = structuredClone(g); fn(n); return n; }), []);
  const busy = !!(shot || promo || game.gameOver || showRules || showSet);

  useEffect(()=>{ SFX.setMuted(!game.settings.sound); },[game.settings.sound]);

  // One snapshot per turn, taken the moment the turn opens. Undo rewinds to it,
  // so a misclicked move is recoverable but you can never rewind the opponent.
  useEffect(()=>{
    if (game.ply !== snapPly.current) {
      snapPly.current = game.ply;
      histRef.current.push(structuredClone(game));
      if (histRef.current.length > 40) histRef.current.shift();
      if (!game.gameOver && game.ply > 0) {   // ply 0 fires behind the rules card
        setToast({ text:`${SIDE[game.turn]} to move`, id:game.ply });
        // Hot-seat: swing the board round to whoever is now on move.
        if (game.settings.autoFlip)
          orbitRef.current.az = game.turn==='w' ? 0 : Math.PI;
      }
    }
  },[game]);
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),1400); return ()=>clearTimeout(t); },[toast]);
  // Repaint the HTML chrome and the 3D palette together. COL is mutated in place
  // and every material reads it at render time, so this one call restyles both.
  useEffect(()=>{ applyTheme(theme);
    try { localStorage.setItem('ca-theme', theme); } catch(e){} },[theme]);

  const hints = useMemo(()=>{
    if (!selectedId || fireState || busy) return [];
    const p = game.pieces[selectedId];
    if (!p || !canMovePiece(game,p)) return [];
    return legalMovesFor(game, selectedId);
  },[game, selectedId, fireState, busy]);

  /** Pre-resolved shot options for the piece currently aiming. */
  const targets = useMemo(()=>{
    if (!fireState || shot) return [];
    return targetOptions(game, fireState.shooterId, arcPref);
  },[game, fireState, arcPref, shot]);
  const targetMap = useMemo(()=>{ const m=new Map(); for(const t of targets) m.set(t.sq,t); return m; },[targets]);
  const locked = aimSq!=null ? targetMap.get(aimSq) : null;
  // What this shot will actually do — shown BEFORE you commit.
  const preview = useMemo(()=>(
    locked && fireState ? shotPreview(game, fireState.shooterId, locked.sim) : []
  ),[game, fireState, locked]);

  /*── fire ─────────────────────────────────────────────────────────────*/
  const enterFire = useCallback(id=>{
    const p = game.pieces[id];
    if (!p) return;
    if (!canFire(game,p)) {
      const why = fireBlockReason(game,p);
      if (why) { setDenied(why); SFX.tick('deny'); }
      return;
    }
    setArcPref(weaponOf(p, game).arcBand==='lob' ? 'lob' : 'flat');
    setDenied(null);
    setAimSq(null);
    setSelected(id);
    setFireState({ shooterId:id, startedAt:performance.now() });
    setClock(CONFIG.SHOT_CLOCK_SECONDS);
    SFX.tick('select');
  },[game]);

  const cancelFire = useCallback(()=>{ setFireState(null); setAimSq(null); },[]);

  const forfeitShot = useCallback(()=>{
    const fs=fireState; if(!fs) return;
    setFireState(null); setAimSq(null);
    mutate(st=>{
      st.turnState.forfeited = true;
      say(st,'shot','Shot clock expired — shot forfeited this turn. No cooldown; the piece stays loaded.');
    });
  },[fireState, mutate]);

  const doFire = useCallback(()=>{
    const fs=fireState;
    if (!fs || shot || firing.current || !locked) return;
    const p = game.pieces[fs.shooterId];
    if (!p || !canFire(game,p)) return;
    firing.current = true;
    const w = weaponOf(p, game);
    const sim = locked.sim;                       // exactly what the preview showed
    pendSim.current = { shooterId:fs.shooterId, sim, blast:w.blast };
    setFireState(null); setAimSq(null);
    const duration = sim.beam ? CONFIG.BEAM_LIFETIME_S
      : Math.max(0.14,(sim.pts.length-1)*CONFIG.SIM_DT);
    setShot({ key:'s'+game.seq+'_'+Date.now(), pts:sim.pts, color:w.tracer,
              size:w.size, beam:!!sim.beam, duration });
    SFX.launch(p.type, duration);
    mutate(st=>{
      const q = st.pieces[fs.shooterId]; if(!q) return;
      // cooldown is set inside resolveShot, once the shell lands
      st.turnState.firedId=q.id;
      const [mx,,mz]=worldOf(q.sq);
      fx(st,'muzzle',{ x:mx, y:muzzleY(q), z:mz, color:w.tracer });
      say(st,'shot',`${label(q)} fires ${w.label} at ${sqName(locked.sq)} (${locked.sol.arcUsed}).`);
    });
  },[fireState, shot, game, locked, mutate]);

  const onShotDone = useCallback(()=>{
    const ps = pendSim.current;
    pendSim.current = null;
    firing.current = false;
    setShot(null);
    if (ps) {
      if (!ps.sim.offBoard) SFX.impact(ps.blast);
      mutate(st=>resolveShot(st, ps.shooterId, ps.sim));
    }
  },[mutate]);

  /*── move ─────────────────────────────────────────────────────────────*/
  const playMove = useCallback((mv, promoteType)=>{
    setSelected(null);
    mutate(st=>{
      if (st.gameOver || st.turnState.movedId) return;
      const id = st.board[mv.from];
      const p = id!=null ? st.pieces[id] : null;
      if (!p || p.color!==st.turn || st.turnState.firedId===id) return;
      // Re-derive from live state: a queued click may describe a stale position.
      const fresh = legalMovesFor(st,id).find(m =>
        m.to===mv.to && !!m.castle===!!mv.castle && !!m.enPassant===!!mv.enPassant);
      if (!fresh) return;
      st.lastMoveSquares = { from:fresh.from, to:fresh.to };
      if (applyMove(st, fresh, promoteType)) advanceTurn(st);   // the move ends the turn
    });
    SFX.tick('move');
  },[mutate]);

  /** In aim mode a board click locks a target; otherwise it selects or moves. */
  const onSquare = useCallback(sq=>{
    if (busy) return;
    if (fireState) {
      if (targetMap.has(sq)) { setAimSq(sq); SFX.tick('select'); }
      else SFX.tick('deny');
      return;
    }
    const mv = hints.find(h=>h.to===sq);
    if (mv) { mv.promote ? setPromo(mv) : playMove(mv); return; }
    const id = game.board[sq];
    setSelected(id!=null ? id : null);
    setDenied(null);
    if (id!=null) SFX.tick('select');
  },[fireState, busy, game, hints, playMove, targetMap]);

  const onPick = useCallback(id=>{
    if (busy) return;
    const p = game.pieces[id]; if(!p) return;
    if (fireState) { onSquare(p.sq); return; }        // clicking a piece targets its square
    const mv = hints.find(h=>h.to===p.sq);
    if (mv) { mv.promote ? setPromo(mv) : playMove(mv); return; }
    // Once the move is spent, clicking a loaded piece goes straight to aiming.
    if (canFire(game,p) && !canMovePiece(game,p)) { enterFire(id); return; }
    setSelected(id);
    setDenied(p.color===game.turn ? fireBlockReason(game,p) : null);
    SFX.tick('select');
  },[fireState, busy, game, hints, playMove, enterFire, onSquare]);

  /* Because the move auto-ends the turn, "undo" has to reach back across the ply
     boundary — but only to the start of your OWN last turn, never into the
     opponent's. Acted-this-turn → rewind to this turn's start; already handed
     over → rewind to the start of the turn you just played. */
  const acted = !!(game.turnState.movedId || game.turnState.firedId || game.turnState.forfeited);
  const h = histRef.current;
  const undoIdx = acted ? h.length-1 : h.length-2;
  const canUndo = !shot && !game.gameOver && undoIdx >= 0 && !!h[undoIdx];
  const undoTurn = useCallback(()=>{
    if (shot) return;
    const hh = histRef.current;
    const actedNow = !!(game.turnState.movedId || game.turnState.firedId || game.turnState.forfeited);
    const i = actedNow ? hh.length-1 : hh.length-2;
    if (i < 0 || !hh[i]) return;
    const restore = hh[i];
    hh.length = i;                       // drop everything from that point on
    snapPly.current = -1;                // let the effect re-snapshot cleanly
    setSelected(null); setFireState(null); setAimSq(null); setPromo(null); setDenied(null);
    firing.current = false; pendSim.current = null;
    setGame(structuredClone(restore));
    SFX.tick('deny');
  },[shot, game]);



  /*── shot clock ───────────────────────────────────────────────────────*/
  useEffect(()=>{
    if (!fireState || !game.settings.shotClock){ setClock(CONFIG.SHOT_CLOCK_SECONDS); return; }
    let raf;
    const tick=()=>{
      const left = CONFIG.SHOT_CLOCK_SECONDS - (performance.now()-fireState.startedAt)/1000;
      setClock(Math.max(0,left));
      if (left<=0){ forfeitShot(); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[fireState, forfeitShot, game.settings.shotClock]);

  /*── pointer: orbit + fire ────────────────────────────────────────────*/
  const onPointerDown = useCallback(e=>{
    if (e.button===2 || e.button===1){ orbiting.current=true; e.preventDefault(); }
  },[]);

  const onPointerMove = useCallback(e=>{
    if (!orbiting.current) return;
    const o = orbitRef.current;
    o.az -= e.movementX*0.006;
    o.polar = clamp(o.polar - e.movementY*0.005, CONFIG.CAM.minPolar, CONFIG.CAM.maxPolar);
  },[]);

  useEffect(()=>{
    const up = ()=>{ orbiting.current=false; };
    const wheel = e=>{
      if (!stageRef.current || !stageRef.current.contains(e.target)) return;
      e.preventDefault();
      const o=orbitRef.current;
      o.dist = clamp(o.dist + e.deltaY*0.012, CONFIG.CAM.minDist, CONFIG.CAM.maxDist);
    };
    window.addEventListener('pointerup', up);
    window.addEventListener('wheel', wheel, {passive:false});
    return ()=>{ window.removeEventListener('pointerup',up); window.removeEventListener('wheel',wheel); };
  },[]);

  /*── keys ─────────────────────────────────────────────────────────────*/
  const shooter  = fireState ? game.pieces[fireState.shooterId] : null;
  const shooterW = shooter ? weaponOf(shooter, game) : null;
  const canPickArc = !!shooterW && shooterW.arcBand==='both';
  const [hoverSq, setHoverSq] = useState(null);
  const onTileHover = useCallback(sq=>{ setHoverSq(h => h===sq ? h : sq); },[]);

  useEffect(()=>{
    const onKey = e=>{
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key==='?' || e.key==='/'){ e.preventDefault(); setRules(v=>!v); return; }
      if (showRules || showSet){ if(e.key==='Escape'){ setRules(false); setSet(false); } return; }
      if (e.key==='Escape'){ fireState ? cancelFire() : (setSelected(null), setDenied(null)); }
      else if (e.key==='f'||e.key==='F'){ if(!fireState && selectedId) enterFire(selectedId); }
      else if (e.key===' '){ if(fireState){ e.preventDefault(); doFire(); } }
      else if (e.key==='Enter'){ if (fireState) doFire(); }
      else if (e.key==='Tab'){ if(canPickArc){ e.preventDefault(); setArcPref(a=>a==='flat'?'lob':'flat'); } }
      else if (e.key==='m'||e.key==='M'){ mutate(st=>{ st.settings.sound = !st.settings.sound; }); }
      else if (e.key==='u'||e.key==='U'){ undoTurn(); }
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[fireState, selectedId, showRules, showSet, canPickArc, enterFire, cancelFire, doFire, mutate, undoTurn]);

  /*── render ───────────────────────────────────────────────────────────*/
  const ts = game.turnState;
  const stale = false;
  const selPiece = selectedId ? game.pieces[selectedId] : null;
  const selCanFire = selPiece && canFire(game, selPiece);

  const clearCount = targets.filter(t=>t.status==='clear').length;
  const inChk = inCheck(game, game.turn);
  const prompt = game.gameOver ? 'Game over'
    : fireState ? (locked
        ? <>Target <b>{sqName(locked.sq)}</b> — press <b>Fire</b>, or click another square</>
        : <>Click a <b>marked square</b> to aim · {clearCount} clear, {targets.length-clearCount} blocked</>)
    : shot ? 'Shot in flight…'
    : inChk ? <><b>You are in check</b> — your move must answer it</>
    : ts.firedId ? <>Shot fired. Now <b>move</b> — that ends your turn</>
    : <>Optionally <b>fire</b> a loaded piece, then <b>move</b> to end your turn</>;

  return (
    <div className="app">
      <Rail game={game} selectedId={selectedId} onPick={onPick} />

      <div className="stage" ref={stageRef}
           onPointerDown={onPointerDown} onPointerMove={onPointerMove}
           onContextMenu={e=>e.preventDefault()}>
        <Canvas camera={{position:[0,10,11], fov:40, near:0.1, far:120}}
                dpr={[1,2]} gl={{antialias:true}}>
          <Scene game={game} selectedId={selectedId} hoverId={hover&&hover.id} hints={hints}
                 fireState={fireState} targets={targets} aimSq={aimSq}
                 hoverSq={fireState?hoverSq:null} themeName={theme}
                 orbitRef={orbitRef} shakeRef={shakeRef} shot={shot}
                 onSquare={onSquare} onPick={onPick} onShotDone={onShotDone}
                 onTileHover={onTileHover}
                 onHover={(id,e)=>setHover(id?{id,x:e.clientX,y:e.clientY}:null)} />
        </Canvas>

        <div className="hud">
          {prompt && <div className="tl"><div className="prompt">{prompt}</div></div>}
          {game.banner && <div className="shout">{game.banner.text}</div>}
          {inChk && !game.gameOver && !shot && (
            <div className="checkbar">
              CHECK — {SIDE[game.turn]} must answer it
            </div>)}
          {toast && !game.banner && (
            <div className="turntoast" key={toast.id}>
              <span className={'dot '+game.turn} /> {toast.text}
            </div>)}

          <div className="tr">
            <select className="themesel" value={theme} title="Theme"
              onChange={e=>setTheme(e.target.value)}>
              {THEME_ORDER.map(k=><option key={k} value={k}>{THEMES[k].label}</option>)}
            </select>
            <button className="icon ghost" title="Rules (?)" onClick={()=>setRules(true)}>?</button>
            <button className="icon ghost" title="Sound (M)"
              onClick={()=>mutate(st=>{ st.settings.sound = !st.settings.sound; })}>
              {game.settings.sound ? '🔊' : '🔇'}</button>
            <button className="icon ghost" title="Settings" onClick={()=>setSet(true)}>⚙</button>
            <button className="icon ghost" title="Flip view"
              onClick={()=>{ orbitRef.current.az = Math.abs(normAng(orbitRef.current.az))<0.1 ? Math.PI : 0; }}>⇅</button>
          </div>

          {!fireState && !shot && !game.gameOver && (
            <div className="dock">
              {selPiece && (
                <>
                  <div className="cell">
                    <div className="cap">Selected</div>
                    <div className="val">{GLYPH[selPiece.color][selPiece.type]} {NAME[selPiece.type]} {sqName(selPiece.sq)}</div>
                    {denied && <div style={{fontSize:10.5,color:'var(--dim)',maxWidth:210}}>{denied}</div>}
                  </div>
                  <div className="sep" />
                </>)}
              <button className="fire" disabled={!selCanFire} onClick={()=>enterFire(selectedId)}>
                AIM <kbd style={{marginLeft:6}}>F</kbd>
              </button>
              <button disabled={!canUndo} onClick={undoTurn} title="Take back your last turn">
                UNDO <kbd style={{marginLeft:6}}>U</kbd>
              </button>
            </div>)}

          {fireState && shooter && shooterW && (
            <div className="dock" onPointerDown={e=>e.stopPropagation()}>
              <div className="cell">
                <div className="cap">{NAME[shooter.type]} {sqName(shooter.sq)}</div>
                <div className="val">{shooterW.label} · {shooterW.damage} dmg</div>
              </div>
              <div className="sep" />
              <div className="cell" style={{minWidth:210}}>
                <div className="cap">Target</div>
                {!locked ? (
                  <div className="shotline"><span className="pill none">
                    {targets.length ? 'click a marked square' : 'no shot from here'}</span></div>
                ) : (
                  <>
                    <div className="shotline">
                      <b>{sqName(locked.sq)}</b>
                      {locked.status==='clear'
                        ? <span className="pill clear">clear</span>
                        : <span className="pill block">blocked{locked.blockerId && game.pieces[locked.blockerId]
                            ? ' by '+NAME[game.pieces[locked.blockerId].type]+' '+sqName(game.pieces[locked.blockerId].sq)
                            : ''}</span>}
                    </div>
                    <div className="hits">
                      {preview.filter(h=>h.dmg>0||h.blocked==='immune'||h.blocked==='ff-off').length
                        ? preview.filter(h=>h.dmg>0||h.blocked==='immune'||h.blocked==='ff-off').map(h=>(
                        <div key={h.id} className={'hit'+(h.friendly?' own':'')+(h.lethal?' kill':'')}>
                          <span>{GLYPH[h.color][h.type]} {sqName(h.sq)}</span>
                          <span>{h.blocked==='immune' ? 'immune'
                               : h.blocked==='ff-off' ? 'safe'
                               : h.lethal ? `−${h.dmg} KILL` : `−${h.dmg}`}</span>
                        </div>
                      )) : <div className="hit none">hits nothing</div>}
                    </div>
                  </>)}
              </div>
              <div className="sep" />
              <div className="cell">
                <div className="cap">Arc {canPickArc ? '' : '(fixed)'}</div>
                <div className="arcsel">
                  <button className={arcPref==='flat'?'sel':''} disabled={!canPickArc}
                          onClick={()=>setArcPref('flat')}>FLAT</button>
                  <button className={arcPref==='lob'?'sel':''} disabled={!canPickArc}
                          onClick={()=>setArcPref('lob')}>LOB</button>
                </div>
              </div>
              <div className="sep" />
              {game.settings.shotClock && (<>
                <div className="cell">
                  <div className="cap">Shot clock</div>
                  <div className={'clk'+(clock<=5?' hot':'')}>{clock.toFixed(1)}</div>
                </div>
                <div className="sep" />
              </>)}
              <button className="fire" disabled={!locked} onClick={doFire}>
                FIRE <kbd style={{marginLeft:6}}>Space</kbd></button>
              <button className="ghost" onClick={cancelFire}>Cancel</button>
            </div>)}
        </div>
      </div>

      {showRules && <RulesCard onClose={()=>setRules(false)} />}
      {showSet && <SettingsCard game={game} onClose={()=>setSet(false)}
        onSet={(k,v)=>mutate(st=>{ st.settings[k]=v; say(st,'sys',`${k} → ${v?'on':'off'}`); })} />}

      {promo && (
        <div className="veil"><div className="card" style={{width:'min(430px,92vw)'}}>
          <h2>PROMOTION</h2>
          <p className="sub">Pawn reaches {sqName(promo.to)}. It arrives at {Math.round(CONFIG.PROMOTION_HP_FRACTION*100)}% of the new piece's max HP.</p>
          <div className="grid4">
            {['q','r','b','n'].map(t=>(
              <button key={t} onClick={()=>{ const mv=promo; setPromo(null); playMove(mv,t); }}>
                {GLYPH[game.turn][t]}
                <span>{NAME[t]}<br />{Math.round(CONFIG.HP[t]*CONFIG.PROMOTION_HP_FRACTION)} HP</span>
              </button>))}
          </div>
        </div></div>)}

      {game.gameOver && (
        <div className="veil"><div className="card over" style={{width:'min(400px,92vw)',textAlign:'center'}}>
          <h2>GAME OVER</h2>
          <div className="big" style={{color:game.gameOver.winner?'var(--accent)':'var(--dim)'}}>
            {game.gameOver.winner ? SIDE[game.gameOver.winner].toUpperCase()+' WINS' : 'DRAW'}
          </div>
          <p className="sub" style={{marginTop:6}}>{game.gameOver.reason}</p>
          <button className="go" style={{width:'100%'}} onClick={()=>{
            setSelected(null); setFireState(null); setShot(null); setPromo(null);
            firing.current=false; pendSim.current=null; setGame(bootGame());
          }}>NEW GAME</button>
        </div></div>)}
    </div>);
}

/** Keeps a render-time throw from blanking the page. */
class Boundary extends React.Component {
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error('CHESS ARTILLERY crashed:', err, info); }
  render(){
    if (!this.state.err) return this.props.children;
    return (
      <div className="veil"><div className="card" style={{width:'min(520px,92vw)'}}>
        <h2>SOMETHING BROKE</h2>
        <p className="sub">The game hit an unexpected error. Reload to start over.</p>
        <pre style={{fontSize:10,color:'#ff9f9f',whiteSpace:'pre-wrap',maxHeight:150,overflow:'auto'}}>
          {String(this.state.err && this.state.err.stack || this.state.err)}</pre>
        <button className="go" style={{width:'100%',marginTop:14}}
          onClick={()=>window.location.reload()}>RELOAD</button>
      </div></div>);
  }
}

/* Console handle for retuning: CA.legalMoves(CA.boot(),'w').length → 20 */
window.CA = {
  CONFIG, boot:bootGame, newGame, beginTurn, advanceTurn, applyMove, legalMoves, legalMovesFor,
  pieceMoves, attacked, inCheck, checkAttackerCount, simulateShot, resolveShot, applyDamage,
  killPiece, isCrippled, slideRange, sectorCenters, clampYawToSector, aimAt, canFire,
  canMovePiece, sqName, sqOfWorld, worldOf, mkSq, fileOf, rankOf, buildSAN, weaponOf, muzzleY,
  findKing, positionKey, targetOptions, fireBlockReason, SFX, shotPreview, projectMove,
  damageProfile, gunsLive, kingArmed, fireCheckShots, batteryPartner, fileState, lineState, pawnIsChained,
};

createRoot(document.getElementById('root')).render(<Boundary><App /></Boundary>);
</script>
