<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHESS ARTILLERY</title>

<style>
  /* Warm, light, minimal. No blues, no blacks. */
  :root {
    --bg:      #efe9dd;
    --board:   #e7dfd0;
    --panel:   #faf7f1;
    --ink:     #2b2620;
    --dim:     #7d7365;
    --faint:   #a89c8b;
    --hair:    #e0d7c7;
    --accent:  #c2662f;   /* terracotta */
    --gold:    #c79418;
    --red:     #b3402e;
    --green:   #5e8a4e;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased; }
  #root { height:100%; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .app { display:flex; height:100%; }
  .stage { flex:1; position:relative; min-width:0; background:var(--bg); }
  .stage canvas { display:block; }

  /* ── left rail ───────────────────────────────────────────────────── */
  .rail { width:260px; min-width:260px; height:100%; background:var(--panel);
    border-right:1px solid var(--hair); display:flex; flex-direction:column; }
  .rail section { padding:16px 18px; }
  .rail section + section { border-top:1px solid var(--hair); }
  .lbl { font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint);
    font-weight:600; margin-bottom:10px; }

  .wordmark { font-size:12px; letter-spacing:.34em; font-weight:600; color:var(--ink); }
  .wordmark b { color:var(--accent); font-weight:600; }

  .side { display:flex; align-items:center; gap:11px; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .dot.w { background:#fffdf8; box-shadow:0 0 0 1px #0003; }
  .dot.b { background:#6b5442; box-shadow:0 0 0 1px #0002; }
  .side .nm { font-size:16px; font-weight:600; letter-spacing:.02em; }

  .steps { margin-top:14px; display:flex; flex-direction:column; gap:2px; }
  .step { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:6px;
    font-size:12px; color:var(--faint); }
  .step.now { background:#c2662f18; color:var(--ink); }
  .step.ok  { color:var(--green); }
  .step .n { width:16px; height:16px; border-radius:50%; border:1px solid currentColor;
    font-size:9px; display:flex; align-items:center; justify-content:center; flex:none; }
  .step.ok .n { background:var(--green); border-color:var(--green); color:#fff; }
  .step .hint { margin-left:auto; font-size:10px; color:var(--faint); }

  .alert { margin-top:12px; padding:7px 10px; border-radius:6px; font-size:11.5px;
    background:#b3402e14; color:#8e3324; }

  .roster { flex:1; min-height:0; display:flex; flex-direction:column; padding-bottom:6px; }
  .roster .list { overflow-y:auto; flex:1; min-height:0; margin:0 -6px; padding:0 6px; }
  .unit { display:grid; grid-template-columns:16px 1fr auto; gap:9px; align-items:center;
    padding:5px 7px; border-radius:6px; cursor:pointer; }
  .unit:hover { background:#00000008; }
  .unit.on { background:#c2662f1a; }
  .unit .g { font-size:14px; line-height:1; }
  .unit .nm { font-size:11.5px; color:var(--dim); }
  .unit .nm em { font-style:normal; color:var(--faint); }
  .bar { height:3px; border-radius:2px; background:#00000012; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; border-radius:2px; }
  .tag { font-size:9px; letter-spacing:.1em; font-weight:600; text-transform:uppercase; }
  .tag.rdy { color:var(--accent); } .tag.cd { color:var(--gold); } .tag.off { color:var(--faint); }

  .moves { height:104px; display:flex; flex-direction:column; }
  .moves .list { overflow-y:auto; flex:1; min-height:0; }
  .moves table { width:100%; border-collapse:collapse; font-size:11.5px; }
  .moves td { padding:1px 6px 1px 0; color:var(--dim); }
  .moves td.n { color:var(--faint); width:24px; text-align:right; }

  .feed { height:150px; display:flex; flex-direction:column; }
  .feed .list { overflow-y:auto; flex:1; min-height:0; font-size:11px; line-height:1.55; }
  .feed .list div { padding:2px 0; color:var(--dim); }
  .k-dmg{color:#a8552c}.k-kill{color:var(--red)}.k-shot{color:var(--accent)}
  .k-crip{color:#96700e}.k-heal{color:var(--green)}.k-sys{color:var(--faint)}.k-move{color:var(--dim)}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#d6cbb8;border-radius:3px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── buttons ─────────────────────────────────────────────────────── */
  button { font:inherit; font-size:12px; border:1px solid var(--hair); background:#00000006;
    color:var(--ink); padding:8px 14px; border-radius:7px; cursor:pointer; letter-spacing:.03em;
    transition:background .12s, border-color .12s, opacity .12s; }
  button:hover:not(:disabled){ background:#0000000f; border-color:#cdc0ab; }
  button:disabled{ opacity:.35; cursor:default; }
  button.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.go:hover:not(:disabled){ background:#d3773c; }
  button.fire { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  button.fire:hover:not(:disabled){ background:#c74e39; }
  button.ghost { background:transparent; }
  button.icon { padding:7px 10px; border-radius:8px; background:#faf7f1e6; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  kbd { font-family:inherit; font-size:10px; padding:1px 5px; border-radius:4px;
    background:#0000000d; color:var(--dim); border:1px solid var(--hair); }

  /* ── stage overlays ──────────────────────────────────────────────── */
  .hud { position:absolute; inset:0; pointer-events:none; }
  .hud > * { pointer-events:auto; }

  .tl { position:absolute; top:16px; left:18px; pointer-events:none; }
  .tr { position:absolute; top:16px; right:18px; display:flex; gap:8px; }
  .prompt { font-size:12.5px; color:var(--dim); letter-spacing:.02em; }
  .prompt b { color:var(--ink); font-weight:600; }

  .dock { position:absolute; left:50%; transform:translateX(-50%); bottom:22px;
    background:#faf7f1f2; border:1px solid var(--hair); border-radius:12px;
    padding:12px 16px; display:flex; gap:18px; align-items:center;
    backdrop-filter:blur(10px); box-shadow:0 10px 30px #0000001f; }
  .dock .cell { display:flex; flex-direction:column; gap:5px; }
  .dock .cap { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
  .dock .val { font-size:13px; font-weight:600; }
  .dock .sep { width:1px; align-self:stretch; background:var(--hair); }
  .clk { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; min-width:58px;
    text-align:right; letter-spacing:-.01em; }
  .clk.hot { color:var(--red); }

  .arcsel { display:flex; gap:0; border:1px solid var(--hair); border-radius:7px; overflow:hidden; }
  .arcsel button { border:none; border-radius:0; padding:6px 12px; font-size:11px; background:transparent; }
  .arcsel button.sel { background:var(--accent); color:#fff; font-weight:600; }
  .arcsel button:disabled { opacity:.3; }

  /* ── modals ──────────────────────────────────────────────────────── */
  .veil { position:fixed; inset:0; background:#efe9ddd8; display:flex; align-items:center;
    justify-content:center; z-index:100; backdrop-filter:blur(4px); }
  .card { background:var(--panel); border:1px solid var(--hair); border-radius:14px; padding:26px 28px;
    width:min(660px, 92vw); max-height:88vh; overflow:auto; box-shadow:0 24px 60px #00000026; }
  .card h2 { margin:0 0 4px; font-size:15px; letter-spacing:.2em; font-weight:600; }
  .card .sub { color:var(--dim); font-size:12px; margin:0 0 20px; }

  .rules { display:grid; grid-template-columns:1fr 1fr; gap:22px 30px; }
  .rules h4 { margin:0 0 8px; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--accent); font-weight:600; }
  .rules ul { margin:0; padding:0; list-style:none; }
  .rules li { font-size:12px; line-height:1.65; color:var(--dim); padding-left:13px; position:relative; }
  .rules li::before { content:''; position:absolute; left:0; top:9px; width:4px; height:4px;
    border-radius:50%; background:var(--faint); }
  .rules li b { color:var(--ink); font-weight:600; }
  table.wt { width:100%; border-collapse:collapse; font-size:11.5px; }
  table.wt th { text-align:left; font-size:9px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); font-weight:600; padding:0 8px 6px 0; }
  table.wt td { padding:3px 8px 3px 0; color:var(--dim); border-top:1px solid var(--hair); }
  table.wt td.p { color:var(--ink); }

  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .grid4 button { padding:16px 6px; font-size:26px; line-height:1; }
  .grid4 button span { display:block; font-size:10px; color:var(--dim); margin-top:7px; letter-spacing:.08em; }

  .toggle { display:flex; align-items:flex-start; gap:11px; padding:9px 0; cursor:pointer; }
  .toggle input { margin-top:2px; accent-color:var(--accent); width:15px; height:15px; }
  .toggle .t { font-size:12.5px; }
  .toggle .d { font-size:11px; color:var(--faint); margin-top:2px; }

  .over .big { font-size:30px; font-weight:600; letter-spacing:.1em; margin:10px 0 4px; }

  .tip { position:fixed; z-index:60; pointer-events:none; background:#faf7f1f7;
    border:1px solid var(--hair); border-radius:9px; padding:10px 12px; width:214px;
    box-shadow:0 10px 26px #0000001f; }
  .tip .h { font-size:12.5px; font-weight:600; margin-bottom:6px; }
  .tip .r { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); padding:1px 0; }
  .tip .r b { color:var(--ink); font-weight:600; }
  .tip .w { margin-top:7px; padding-top:7px; border-top:1px solid var(--hair);
    font-size:11px; color:var(--dim); line-height:1.5; }

  .err { position:fixed; inset:0; background:#fdf3f0; color:#8e3324; padding:24px;
    font:12px ui-monospace,monospace; white-space:pre-wrap; overflow:auto; z-index:999; }
  .boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--faint); letter-spacing:.34em; font-size:11px; }

  .themesel { font:inherit; font-size:11.5px; color:var(--ink); background:#faf7f1e6;
    border:1px solid var(--hair); border-radius:8px; padding:7px 8px; cursor:pointer;
    letter-spacing:.03em; }
  .themesel:hover { border-color:#cdc0ab; }

  /* expected-damage readout while aiming */
  .hits { display:flex; flex-direction:column; gap:1px; margin-top:4px; }
  .hit { display:flex; justify-content:space-between; gap:12px; font-size:11px;
    color:var(--ink); font-variant-numeric:tabular-nums; }
  .hit.own { color:var(--gold); }
  .hit.kill { color:var(--red); font-weight:600; }
  .hit.none { color:var(--faint); }

  /* whose turn it is, briefly, on handoff */
  /* you are in check: impossible to miss, and it says what you must do */
  .checkbar { position:absolute; left:50%; top:0; transform:translateX(-50%);
    background:var(--red); color:#fff; font-weight:700; font-size:12.5px;
    letter-spacing:.16em; padding:7px 22px; border-radius:0 0 10px 10px;
    box-shadow:0 4px 18px #0003; pointer-events:none; }

  .turntoast { position:absolute; left:50%; top:14%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:9px 18px; border-radius:24px;
    background:var(--panel); border:1px solid var(--hair); box-shadow:0 8px 26px #0000001f;
    font-size:14px; font-weight:600; letter-spacing:.06em; pointer-events:none;
    animation:toastin 1.4s ease forwards; }
  @keyframes toastin { 0%{opacity:0;transform:translate(-50%,-8px)} 12%{opacity:1;transform:translate(-50%,0)}
    72%{opacity:1} 100%{opacity:0} }

  /* live damage breakdown */
  .dmg { border-top:1px solid var(--hair); padding-top:5px; }
  .dl { display:flex; justify-content:space-between; gap:10px; padding:1.5px 0; font-size:11px; }
  .dl span:last-child { font-variant-numeric:tabular-nums; }
  .dl.bonus { color:var(--accent); }
  .dl.tot { border-top:1px solid var(--hair); margin-top:4px; padding-top:4px;
    font-weight:600; color:var(--ink); font-size:12.5px; }

  /* big transient callout (EN PASSANT) */
  .shout { position:absolute; left:50%; top:16%; transform:translateX(-50%);
    font-size:34px; font-weight:700; letter-spacing:.18em; color:var(--accent);
    text-shadow:0 2px 0 #fff, 0 0 26px #fff; pointer-events:none; }

  /* aim-mode target readout */
  .shotline { display:flex; align-items:center; gap:7px; font-size:12px; }
  .shotline .pill { font-size:9.5px; letter-spacing:.12em; font-weight:600; text-transform:uppercase;
    padding:2px 7px; border-radius:20px; }
  .pill.clear { background:#5e8a4e1f; color:#3f6633; }
  .pill.block { background:#b3402e1f; color:#8e3324; }
  .pill.none  { background:#00000010; color:var(--faint); }

  @media (max-width:1080px){ .rail{width:224px;min-width:224px} .rules{grid-template-columns:1fr} }
</style>

<div id="root"><div class="boot">CHESS ARTILLERY</div></div>
<div id="errbox"></div>

<script>
  window.__fatal = function (m) {
    var b = document.getElementById('errbox');
    if (b) b.innerHTML = '<div class="err"><b>CHESS ARTILLERY failed to start</b>\n\n' +
      String(m).replace(/</g, '&lt;') + '</div>';
  };
  window.addEventListener('error', function (e) { window.__fatal(e.message + '\n' + (e.error && e.error.stack || '')); });
  window.addEventListener('unhandledrejection', function (e) { window.__fatal(e.reason && e.reason.stack || e.reason); });
</script>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "three": "https://esm.sh/three@0.169.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.10?external=react,react-dom,three"
  }
}
</script>

<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useRef, useEffect, useMemo, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import * as THREE from 'three';
import { Canvas, useFrame, useThree } from '@react-three/fiber';

/*═══════════════════════════════════════════════════════════════════════════
  CHESS ARTILLERY — every balance number lives in CONFIG. Nothing below it
  hard-codes a tunable value.

  UNITS   ownTurn = a turn belonging to that piece's owner (every 2 plies)
          ply     = one player's turn
          1 world unit = 1 board square
═══════════════════════════════════════════════════════════════════════════*/

export const CONFIG = {
  HP:     { p: 40,  n: 70,  b: 80,  r: 120, q: 180, k: 150 },
  HEIGHT: { p: 0.5, n: 0.7, b: 0.8, r: 0.75, q: 1.0, k: 1.0 },   // blocks projectiles
  PIECE_RADIUS: 0.30,                                            // collision cylinder
  MUZZLE_HEIGHT_FRACTION: 0.78,   // shots leave below the top, so flat shots can hit short pieces

  // Below this fraction a piece shows as WOUNDED. Cosmetic only: movement and
  // attacks are never altered, so chess stays exactly chess.
  CRIPPLE_AT_HP_FRACTION: 0.5,
  PROMOTION_HP_FRACTION: 0.5,

  GUNS_LIVE_AFTER_MOVES: 5,   // pure chess until both sides have completed 5 moves
  KING_ARMS_AT_PIECES: 6,     // king gains a weapon once BOTH sides are down to this
  CHECK_SHOT_MULT: 0.5,       // measured: 1.0 gives a 2-check kill. See README.
  CHECK_SHOTS_DEFAULT: true,  // turn off for pure chess check — mate becomes the only win

  /* Chess-culture damage bonuses — every one is a real chess principle, so a
     player who understands chess shoots harder. Hover a piece for a live
     breakdown; without that UI these are just hidden math. */
  BONUS: {
    PAWN_CHAIN:          2,     // defended by another friendly pawn
    PAWN_PER_RANK:       5,     // per rank advanced past its own 4th
    KNIGHT_OUTPOST:      2,     // on the opponent's 5th or 6th rank
    KNIGHT_RIM:          0.5,   // a knight on the rim is dim
    KNIGHT_PRONG_RADIUS: 1.5,   // fork prongs hit the 2 nearest enemies within this
    KNIGHT_PRONG_FALLOFF: 0.5,  // the second prong lands at this fraction
    BISHOP_FIANCHETTO:   2,     // b2 / g2 / b7 / g7
    BISHOP_PAIR:         1.25,  // while both bishops are alive
    BISHOP_OFF_COLOUR:   0,     // colour-complex lock. 0 = immune; 0.35 softens it
    BISHOP_PIERCE_FALLOFF: 0.6, // each further piece in the beam takes less
    ROOK_FILE_BLOCKED:   0.75,
    ROOK_FILE_HALFOPEN:  1.0,
    ROOK_FILE_OPEN:      2.0,
    ROOK_SEVENTH:        1.5,   // pigs on the 7th
    QUEEN_EARLY:         0.5,
    QUEEN_EARLY_UNTIL:   12,    // …before this move number
    // Ceiling on stacked POSITIVE multipliers. Measured: a fianchettoed bishop
    // with the pair was doing 2.2× its base and one-shotting most of the board.
    // Penalties are never capped — you can always be punished in full.
    MAX_BONUS_MULT:      2.0,
  },

  // arcBand   which launch angles this weapon may use:
  //           'flat' → the direct solution, 'lob' → the high one, 'both' → player picks.
  // muzzleFrac height the shot leaves from, as a fraction of the piece's own height.
  //           Low muzzles make a weapon cover-sensitive: a pawn (0.5 tall) blocks a
  //           shell only if the trajectory actually dips below 0.5. Raise these and
  //           shots start skimming over short pieces.
  WEAPONS: {
    p: { lineLocked:true, label:'Chain Gun',   damage:10, cooldown:1, maxRange:4.5,        sector:'pawnDiag',   sectorHalfDeg:30, arcBand:'flat', gravity:1, speed:10,   muzzleFrac:0.62, splashSquares:0, splashDamage:0,  hitscan:false, ignoresCover:false, prongs:0, tracer:'#d99512', size:0.070, blast:0.7 },
    n: { label:'Fork Gun',    damage:18, cooldown:7, maxRange:5, minRange:2.2,        sector:'any',        sectorHalfDeg:180, arcBand:'lob',  gravity:1, speed:null, muzzleFrac:0.80, splashSquares:0, splashDamage:0,  hitscan:false, ignoresCover:true,  prongs:2, tracer:'#4f8f3c', size:0.095, blast:1.5 },
    b: { lineLocked:true, label:'Sniper Beam', damage:25, cooldown:2, maxRange:Infinity, sector:'diagonal',   sectorHalfDeg:26, arcBand:'flat', gravity:0, speed:null, muzzleFrac:0.42, splashSquares:0, splashDamage:0,  hitscan:true,  ignoresCover:false, prongs:0, tracer:'#7a4fb5', size:0.060, blast:0.8 },
    r: { lineLocked:true, label:'Railgun',     damage:35, cooldown:1, maxRange:Infinity, sector:'orthogonal', sectorHalfDeg:26, arcBand:'flat', gravity:0, speed:26,   muzzleFrac:0.55, splashSquares:0, splashDamage:0,  hitscan:false, ignoresCover:false, prongs:0, tracer:'#c25a1e', size:0.105, blast:1.2 },
    q: { label:'Artillery',   damage:45, cooldown:4, maxRange:6,        sector:'any',        sectorHalfDeg:180, arcBand:'both', gravity:1, speed:null, muzzleFrac:0.80, splashSquares:1, splashDamage:20, hitscan:false, ignoresCover:false, prongs:0, tracer:'#b8306a', size:0.125, blast:2.0 },
    k: { label:'Last Stand',  damage:20, cooldown:2, maxRange:2,        sector:'any',        sectorHalfDeg:180, arcBand:'flat', gravity:1, speed:null, muzzleFrac:0.80, splashSquares:0, splashDamage:0,  hitscan:false, ignoresCover:false, prongs:0, tracer:'#8a6408', size:0.085, blast:0.8, endgameOnly:true },
  },
  // Direct fire aims low on the target body so nearer pieces genuinely block the
  // line, instead of the shell arcing over them.
  TARGET_BODY_FRACTION: 0.30,
  GRAVITY: 12,
  MIN_RANGE: 0.75,                // you cannot target your own square
  // per-weapon `minRange` overrides this; a mortar cannot fire at its own feet
  SPLASH_HITS_DIRECT_TARGET: false,

  FRIENDLY_FIRE_DEFAULT: true,
  FRIENDLY_FIRE_MULT: 0.5,

  // The king is never a legal shot target. Only checks hurt him.
  KING: { IMMUNE_TO_PROJECTILES:true, BLOCKS_PROJECTILES:true },

  // Draws are exactly chess draws. No stalemate bleed, no sudden-death timer.
  REPETITION_DRAW: 3,
  FIFTY_MOVE_PLIES: 100,           // 50 moves by each side with no capture or pawn move

  // Capturing kills instantly; the capturer takes the victim's REMAINING HP as
  // recoil, capped at half its own max. Wounded targets are cheap to finish,
  // healthy ones hurt to take. En passant is exempt entirely.
  CAPTURE_DAMAGE_DEFAULT: true,
  CAPTURE_RECOIL_CAP_FRACTION: 0.5,
  CAPTURE_RECOIL_HITS_KING: true,

  SCORCH_PLIES: 2,

  SHOT_CLOCK_SECONDS: 20,
  SHOT_CLOCK_DEFAULT: false,   // off by default: a thinking game shouldn't punish thinking
  AUTO_FLIP_DEFAULT: true,     // hot-seat: swing the board to whoever is on move
  ASSIST_MODE_DEFAULT: false,
  SOUND_DEFAULT: true,
  SOUND: { master:0.55, launch:0.34, impact:0.42, beam:0.20, whistle:0.05, ui:0.07 },

  SIM_DT: 1 / 240,
  PREVIEW_DT: 1 / 90,
  SIM_MAX_TIME: 9,
  TRACER_POINTS: 34,
  BEAM_LIFETIME_S: 0.5,

  // ── cinematics ───────────────────────────────────────────────────────
  FX: {
    shakeOnHit: 0.16, shakeDecay: 4.2, shakeMax: 0.42,
    flashTime: 0.20, waveTime: 0.55, debrisTime: 0.95, debrisCount: 12,
    muzzleTime: 0.11, floaterTime: 1.15, floaterRise: 1.0,
    impactLight: 14, tracerLight: 3.2,
  },
  // The aiming camera is pinned to a FIXED bearing behind the shooter. It must not
  // follow the live aim: aim comes from where the cursor meets the ground, so a
  // camera that rotated with it would feed back into itself and spiral.
  CAM: { dist:13.2, polar:0.90, minPolar:0.22, maxPolar:1.42, minDist:6.5, maxDist:24,
         fireBack:4.2, fireUp:3.6, fireLookAhead:4.5, fireLookY:0.05,
         lerp:0.14, fireLerp:0.12, followShell:0.45 },
};

/*═══════════════════════════════════════════════════════════════════════════
  1. BOARD HELPERS
═══════════════════════════════════════════════════════════════════════════*/

const FILES = 'abcdefgh';
const TYPES = ['p','n','b','r','q','k'];
const NAME  = { p:'Pawn', n:'Knight', b:'Bishop', r:'Rook', q:'Queen', k:'King' };
const GLYPH = { w:{p:'♙',n:'♘',b:'♗',r:'♖',q:'♕',k:'♔'}, b:{p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'} };
const SAN_L = { p:'', n:'N', b:'B', r:'R', q:'Q', k:'K' };
const SIDE  = { w:'White', b:'Black' };

const fileOf = (sq) => sq & 7;
const rankOf = (sq) => sq >> 3;
const mkSq   = (f,r) => r*8+f;
const onBoard= (f,r) => f>=0 && f<8 && r>=0 && r<8;
const sqName = (sq) => FILES[fileOf(sq)] + (rankOf(sq)+1);
const other  = (c) => (c==='w' ? 'b' : 'w');

const worldOf = (sq) => [fileOf(sq)-3.5, 0, 3.5-rankOf(sq)];
function sqOfWorld(x, z) {
  const f = Math.round(x+3.5), r = Math.round(3.5-z);
  return onBoard(f,r) ? mkSq(f,r) : -1;
}

const DIR_ORTHO = [[0,1],[1,0],[0,-1],[-1,0]];
const DIR_DIAG  = [[1,1],[1,-1],[-1,-1],[-1,1]];
const DIR_ALL   = [...DIR_ORTHO, ...DIR_DIAG];
const KNIGHT_OFFSETS = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];

const clamp = (v,a,b) => (v<a?a:v>b?b:v);
const D2R = Math.PI/180;
const normAng = (a) => { while(a>Math.PI) a-=2*Math.PI; while(a<-Math.PI) a+=2*Math.PI; return a; };
const angDiff = (a,b) => normAng(a-b);
/** yaw 0 points along −z (White's forward). */
const yawDir = (y) => [Math.sin(y), -Math.cos(y)];
const yawOf  = (dx,dz) => Math.atan2(dx, -dz);

/*═══════════════════════════════════════════════════════════════════════════
  2. CHESS RULES
═══════════════════════════════════════════════════════════════════════════*/

/**
 * Wounded is now PURELY cosmetic — it marks a piece on the health bar and nothing
 * more.
 *
 * It used to halve a slider's move range, and that same range fed attack
 * detection, so a wounded rook silently stopped giving check from across the
 * board: the position looked like check, the engine disagreed, and every piece
 * was free to move. Chess has to be exactly chess or nothing on top of it can be
 * trusted. Damage kills pieces; it never edits the rules.
 */
const isCrippled = (p) => p.hp < p.maxHp * CONFIG.CRIPPLE_AT_HP_FRACTION;
const slideRange = () => 7;
const knightHasDir = () => true;   // knights are never movement-impaired

function slideMoves(st, from, dirs, maxSteps, color, out) {
  const f0=fileOf(from), r0=rankOf(from);
  for (const [df,dr] of dirs) for (let s=1; s<=maxSteps; s++) {
    const f=f0+df*s, r=r0+dr*s; if(!onBoard(f,r)) break;
    const to=mkSq(f,r), occ=st.board[to];
    if (occ==null) out.push({from,to});
    else { if (st.pieces[occ].color!==color) out.push({from,to,capture:occ}); break; }
  }
}

function pieceMoves(st, id, opts={}) {
  const p = st.pieces[id]; if(!p) return [];
  const out=[], from=p.sq, f0=fileOf(from), r0=rankOf(from), c=p.color;
  if (p.type==='p') {
    const dir = c==='w'?1:-1, start = c==='w'?1:6, last = c==='w'?7:0, r1=r0+dir;
    if (onBoard(f0,r1) && st.board[mkSq(f0,r1)]==null) {
      out.push({from,to:mkSq(f0,r1),promote:r1===last});
      const r2=r0+dir*2;
      // Wounding never touches a pawn — only sliding pieces lose range.
      if (r0===start && st.board[mkSq(f0,r2)]==null) out.push({from,to:mkSq(f0,r2),double:true});
    }
    for (const df of [-1,1]) {
      const f=f0+df; if(!onBoard(f,r1)) continue;
      const to=mkSq(f,r1), occ=st.board[to];
      if (occ!=null && st.pieces[occ].color!==c) out.push({from,to,capture:occ,promote:r1===last});
      else if (occ==null && to===st.ep) out.push({from,to,capture:st.board[mkSq(f,r0)],enPassant:true});
    }
  } else if (p.type==='n') {
    KNIGHT_OFFSETS.forEach(([df,dr],i)=>{
      if(!knightHasDir(p,i)) return;
      const f=f0+df, r=r0+dr; if(!onBoard(f,r)) return;
      const to=mkSq(f,r), occ=st.board[to];
      if (occ==null) out.push({from,to});
      else if (st.pieces[occ].color!==c) out.push({from,to,capture:occ});
    });
  }
  else if (p.type==='b') slideMoves(st,from,DIR_DIAG, slideRange(p),c,out);
  else if (p.type==='r') slideMoves(st,from,DIR_ORTHO,slideRange(p),c,out);
  else if (p.type==='q') slideMoves(st,from,DIR_ALL,  slideRange(p),c,out);
  else if (p.type==='k') {
    slideMoves(st,from,DIR_ALL,1,c,out);
    if (!opts.noCastle) {
      const home = c==='w'?4:60;
      if (from===home && !attacked(st,home,other(c))) {
        if (st.castling[c+'k'] && st.board[home+1]==null && st.board[home+2]==null &&
            !attacked(st,home+1,other(c)) && !attacked(st,home+2,other(c)))
          out.push({from,to:home+2,castle:'k'});
        if (st.castling[c+'q'] && st.board[home-1]==null && st.board[home-2]==null &&
            st.board[home-3]==null && !attacked(st,home-1,other(c)) && !attacked(st,home-2,other(c)))
          out.push({from,to:home-2,castle:'q'});
      }
    }
  }
  return out;
}

/** Walks outward from `sq`, so a crippled slider's shortened reach is respected. */
function attacked(st, sq, color) {
  const f0=fileOf(sq), r0=rankOf(sq);
  for (let i=0;i<8;i++){
    const [df,dr]=KNIGHT_OFFSETS[i], f=f0-df, r=r0-dr; if(!onBoard(f,r)) continue;
    const id=st.board[mkSq(f,r)]; if(id==null) continue;
    const p=st.pieces[id];
    if (p.color===color && p.type==='n' && knightHasDir(p,i)) return true;
  }
  const pdr = color==='w' ? -1 : 1;
  for (const df of [-1,1]){
    const f=f0+df, r=r0+pdr; if(!onBoard(f,r)) continue;
    const id=st.board[mkSq(f,r)]; if(id==null) continue;
    if (st.pieces[id].color===color && st.pieces[id].type==='p') return true;
  }
  for (const [df,dr] of DIR_ALL){
    const f=f0+df, r=r0+dr; if(!onBoard(f,r)) continue;
    const id=st.board[mkSq(f,r)]; if(id==null) continue;
    if (st.pieces[id].color===color && st.pieces[id].type==='k') return true;
  }
  for (const [df,dr] of DIR_ALL){
    const diag = df!==0 && dr!==0;
    for (let s=1;s<=7;s++){
      const f=f0+df*s, r=r0+dr*s; if(!onBoard(f,r)) break;
      const id=st.board[mkSq(f,r)]; if(id==null) continue;
      const p=st.pieces[id];
      if (p.color===color && s<=slideRange(p) && (p.type==='q' || (diag?p.type==='b':p.type==='r'))) return true;
      break;
    }
  }
  return false;
}

const findKing = (st,c) => { for(const id in st.pieces){const p=st.pieces[id]; if(p.color===c&&p.type==='k') return p;} return null; };
const inCheck  = (st,c) => { const k=findKing(st,c); return k ? attacked(st,k.sq,other(c)) : false; };
function checkAttackerCount(st,c){
  const k=findKing(st,c); if(!k) return 0;
  let n=0;
  for(const id in st.pieces){ const p=st.pieces[id]; if(p.color===c) continue;
    if (pieceMoves(st,id,{noCastle:true}).some(m=>m.to===k.sq)) n++; }
  return n;
}

function projectMove(st, mv) {
  const board=st.board.slice(), pieces={};
  for(const k in st.pieces) pieces[k]=st.pieces[k];
  const id=board[mv.from], p={...pieces[id]};
  if (mv.capture!=null){ const t=pieces[mv.capture]; if(t){ board[t.sq]=null; delete pieces[mv.capture]; } }
  board[mv.from]=null; board[mv.to]=id; p.sq=mv.to; pieces[id]=p;
  if (mv.castle){
    const home = p.color==='w'?0:56;
    const rf = mv.castle==='k'?home+7:home, rt = mv.castle==='k'?home+5:home+3;
    const rid=board[rf];
    if(rid!=null){ const rp={...pieces[rid]}; board[rf]=null; board[rt]=rid; rp.sq=rt; pieces[rid]=rp; }
  }
  return { board, pieces, ep:null, castling:st.castling };
}

function legalMoves(st, color) {
  const out=[];
  for(const id in st.pieces){
    if (st.pieces[id].color!==color) continue;
    for(const mv of pieceMoves(st,id)) if(!inCheck(projectMove(st,mv),color)) out.push(mv);
  }
  return out;
}
const legalMovesFor = (st,id) => {
  const p=st.pieces[id]; if(!p) return [];
  return pieceMoves(st,id).filter(mv=>!inCheck(projectMove(st,mv),p.color));
};

/*═══════════════════════════════════════════════════════════════════════════
  3. STATE
═══════════════════════════════════════════════════════════════════════════*/

const BACK_RANK = ['r','n','b','q','k','b','n','r'];

function newGame(settings) {
  const board=new Array(64).fill(null), pieces={};
  let n=0;
  const add=(type,color,sq)=>{ const id=color+type+(n++);
    pieces[id]={id,type,color,sq,hp:CONFIG.HP[type],maxHp:CONFIG.HP[type],
      cooldown:0,hasMoved:false,promotedFrom:null};
    board[sq]=id; };
  for(let f=0;f<8;f++){
    add(BACK_RANK[f],'w',mkSq(f,0)); add('p','w',mkSq(f,1));
    add('p','b',mkSq(f,6));          add(BACK_RANK[f],'b',mkSq(f,7));
  }
  return {
    board, pieces, turn:'w', ply:0, ep:null, epPawn:null,
    castling:{wk:true,wq:true,bk:true,bq:true},
    scorch:[], fx:[], posCounts:{}, halfmove:0, banner:null, kingsArmedAnnounced:false,
    turnState:{movedId:null,firedId:null,forfeited:false,san:null},
    log:[], moveList:[], lastMoveSquares:null,
    gameOver:null,
    settings, seq:0,
  };
}

/*═══════════════════════════════════════════════════════════════════════════
  3b. SOUND — fully synthesised, so the game stays a single file with no assets.
  Browsers block audio until a gesture, so unlock() is called from the START button.
═══════════════════════════════════════════════════════════════════════════*/

const SFX = (() => {
  let ctx = null, master = null, muted = false, noise = null;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = CONFIG.SOUND.master;
      master.connect(ctx.destination);
      const n = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = n.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      noise = n;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const now = () => ctx.currentTime;

  /** noise burst through a swept low-pass — the body of thumps and booms */
  function burst(t0, dur, f0, f1, gain, q) {
    const src = ctx.createBufferSource(); src.buffer = noise; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(f0, t0);
    lp.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+dur);
    lp.Q.value = q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+dur+0.02);
  }
  /** pitched tone sweep — muzzle crack, whistle, beam */
  function tone(t0, dur, f0, f1, gain, type) {
    const o = ctx.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+0.02);
  }

  return {
    unlock(){ ensure(); },
    setMuted(v){ muted = v; if (master) master.gain.value = v ? 0 : CONFIG.SOUND.master; },
    isMuted(){ return muted; },

    /** launch report; `flight` seconds of shell whistle trailing it */
    launch(type, flight) {
      if (muted || !ensure()) return;
      const t = now(), S = CONFIG.SOUND;
      if (type === 'b') { // beam: bright electric zap, no report
        tone(t, 0.30, 2000, 260, S.beam, 'sawtooth');
        burst(t, 0.16, 5000, 900, S.beam*0.5);
        return;
      }
      const heavy = type === 'q' || type === 'r';
      tone (t, heavy?0.20:0.11, heavy?190:300, heavy?46:80, S.launch);
      burst(t, heavy?0.28:0.15, heavy?2600:3400, heavy?150:400, S.launch*0.9);
      if (flight > 0.25 && (type==='n' || type==='q'))
        tone(t+0.06, Math.min(flight-0.06, 1.6), 1250, 520, S.whistle, 'triangle');
    },
    impact(power) {
      if (muted || !ensure()) return;
      const t = now(), S = CONFIG.SOUND, p = clamp(power, 0.5, 2.2);
      burst(t, 0.30+0.16*p, 1500, 70, S.impact*Math.min(1.15, 0.55+0.32*p));
      tone (t, 0.26+0.14*p, 130*(1/p), 34, S.impact*0.85);
      burst(t+0.03, 0.55+0.2*p, 480, 90, S.impact*0.32);   // rolling tail
    },
    thud() {   // a piece dies
      if (muted || !ensure()) return;
      const t = now();
      burst(t, 0.22, 700, 60, CONFIG.SOUND.impact*0.6);
      tone (t, 0.18, 110, 40, CONFIG.SOUND.impact*0.5);
    },
    tick(kind) {  // UI: select / place / deny
      if (muted || !ensure()) return;
      const t = now(), S = CONFIG.SOUND;
      if (kind === 'deny') { tone(t, 0.10, 210, 150, S.ui*0.9, 'square'); return; }
      tone(t, 0.045, kind==='move'?520:880, kind==='move'?300:660, S.ui, 'triangle');
    },
  };
})();

/*═══════════════════════════════════════════════════════════════════════════
  4. LOG + FX EVENTS
═══════════════════════════════════════════════════════════════════════════*/

const label = (p) => `${SIDE[p.color]} ${NAME[p.type]} ${sqName(p.sq)}`;

function say(st, kind, text) {
  st.log.push({ id: st.seq++, turn: Math.floor(st.ply/2)+1, kind, text });
  if (st.log.length > 300) st.log.splice(0, st.log.length-300);
}
/** Visual-only events. Components self-time from mount; pruned each turn. */
function fx(st, kind, o) {
  st.fx.push({ id: st.seq++, kind, ...o });
  if (st.fx.length > 60) st.fx.splice(0, st.fx.length-60);
}

/*═══════════════════════════════════════════════════════════════════════════
  5. DAMAGE
═══════════════════════════════════════════════════════════════════════════*/

function applyDamage(st, id, amount, o={}) {
  const p = st.pieces[id];
  if (!p || amount<=0 || st.gameOver) return 0;
  const [wx,,wz] = worldOf(p.sq);
  const topY = CONFIG.HEIGHT[p.type] + 0.2;

  // Shots pass through the king harmlessly. Only checks hurt him.
  if (p.type==='k' && o.projectile && CONFIG.KING.IMMUNE_TO_PROJECTILES) {
    say(st,'sys',`${label(p)} cannot be shot — the round passes through.`);
    fx(st,'float',{x:wx,y:topY,z:wz,text:'IMMUNE',color:'#6d6355'});
    return 0;
  }
  let dmg = amount; const notes=[];
  if (o.projectile && o.srcColor===p.color) {
    if (!st.settings.friendlyFire) { say(st,'sys',`Friendly fire OFF — ${label(p)} unharmed.`); return 0; }
    dmg *= CONFIG.FRIENDLY_FIRE_MULT; notes.push('friendly fire');
  }
  dmg = Math.max(1, Math.round(dmg));

  const wasCrippled = isCrippled(p);
  p.hp = Math.max(0, p.hp - dmg);
  say(st,'dmg',`${o.source||'Damage'} → ${label(p)} −${dmg}${notes.length?` (${notes.join(', ')})`:''} · ${p.hp}/${p.maxHp}`);
  fx(st,'float',{x:wx,y:topY,z:wz,text:'−'+dmg,color:o.srcColor===p.color?'#a8710f':'#a8291a'});

  if (p.hp<=0) { killPiece(st,id,o.source||'destroyed'); return dmg; }
  if (!wasCrippled && isCrippled(p)) {
    say(st,'crip',`${label(p)} CRIPPLED — ${crippleNote(p)}`);
    fx(st,'float',{x:wx,y:topY+0.28,z:wz,text:'CRIPPLED',color:'#8a6408'});
  }
  return dmg;
}

/** Wounded is a warning light, not a rule change. */
function crippleNote() { return 'under half health — no movement penalty'; }

function killPiece(st, id, reason) {
  const p = st.pieces[id]; if(!p) return;
  const sq = p.sq, [wx,,wz] = worldOf(sq);
  say(st,'kill',`${label(p)} DESTROYED (${reason}).`);
  fx(st,'blast',{x:wx,y:CONFIG.HEIGHT[p.type]*0.5,z:wz,power:1.5,color:'#ffb066'});
  st.board[sq]=null;
  delete st.pieces[id];
  if (p.type==='r') {
    if(sq===0) st.castling.wq=false; if(sq===7) st.castling.wk=false;
    if(sq===56) st.castling.bq=false; if(sq===63) st.castling.bk=false;
  }
  if (p.type==='k') { st.castling[p.color+'k']=false; st.castling[p.color+'q']=false; }
  if (st.epPawn===id){ st.ep=null; st.epPawn=null; }
  if (p.type==='k') endGame(st, other(p.color), `${SIDE[p.color]}'s king was destroyed`);
}

function endGame(st, winner, reason) {
  if (st.gameOver) return;
  st.gameOver = { winner, reason };
  say(st,'sys', winner ? `${SIDE[winner]} wins — ${reason}.` : `Draw — ${reason}.`);
}

/*═══════════════════════════════════════════════════════════════════════════
  6. MOVES
═══════════════════════════════════════════════════════════════════════════*/

function buildSAN(st, mv, promoteType) {
  if (mv.castle) return mv.castle==='k' ? 'O-O' : 'O-O-O';
  const mid = st.board[mv.from], p = mid!=null ? st.pieces[mid] : null;
  if (!p) return '??';
  const cap = mv.capture!=null;
  if (p.type==='p') {
    let s = cap ? FILES[fileOf(mv.from)]+'x'+sqName(mv.to) : sqName(mv.to);
    if (mv.promote) s += '='+SAN_L[promoteType||'q'];
    return s;
  }
  let dis='';
  const rivals = Object.values(st.pieces).filter(q =>
    q.color===p.color && q.type===p.type && q.id!==p.id && legalMovesFor(st,q.id).some(m=>m.to===mv.to));
  if (rivals.length) {
    dis = rivals.every(q=>fileOf(q.sq)!==fileOf(mv.from)) ? FILES[fileOf(mv.from)]
        : rivals.every(q=>rankOf(q.sq)!==rankOf(mv.from)) ? String(rankOf(mv.from)+1)
        : sqName(mv.from);
  }
  return SAN_L[p.type]+dis+(cap?'x':'')+sqName(mv.to);
}

function applyMove(st, mv, promoteType) {
  const id = st.board[mv.from];
  const p = id!=null ? st.pieces[id] : null;
  if (!p) return false;                       // stale move — square already empty
  const san = buildSAN(st, mv, promoteType);
  const fromName = sqName(mv.from);

  let recoil = 0;
  if (mv.capture!=null) {
    const t = st.pieces[mv.capture];
    if (t) {
      // Recoil = the victim's REMAINING HP, capped at half your own max.
      // En passant is a clean free kill — no recoil at all.
      recoil = (st.settings.captureDamage && !mv.enPassant)
        ? Math.min(t.hp, CONFIG.CAPTURE_RECOIL_CAP_FRACTION * p.maxHp) : 0;
      if (mv.enPassant) {
        say(st,'kill',`EN PASSANT — ${label(t)} removed for free. No recoil.`);
        const [ex,,ez] = worldOf(t.sq);
        fx(st,'float',{x:ex,y:CONFIG.HEIGHT[t.type]+0.5,z:ez,text:'EN PASSANT',color:'#8a3ea8'});
        st.banner = { text:'EN PASSANT', until: st.ply + 2 };
      } else {
        say(st,'move',`${SIDE[p.color]} ${NAME[p.type]} ${fromName}×${sqName(mv.to)} takes ${NAME[t.type]} (${t.hp} HP left).`);
      }
      killPiece(st, mv.capture, 'captured');
    }
  }

  st.board[p.sq]=null; st.board[mv.to]=id; p.sq=mv.to;
  p.hasMoved=true;

  if (mv.castle) {
    const home = p.color==='w'?0:56;
    const rf = mv.castle==='k'?home+7:home, rt = mv.castle==='k'?home+5:home+3;
    const rid = st.board[rf];
    if (rid!=null){ st.board[rf]=null; st.board[rt]=rid;
      st.pieces[rid].sq=rt; st.pieces[rid].hasMoved=true; }
    say(st,'move',`${SIDE[p.color]} castles ${mv.castle==='k'?'king-side':'queen-side'}.`);
  } else if (mv.capture==null) {
    say(st,'move',`${SIDE[p.color]} ${NAME[p.type]} ${fromName} → ${sqName(mv.to)}.`);
  }

  if (mv.promote) {
    const nt = promoteType||'q';
    p.promotedFrom=p.type; p.type=nt; p.maxHp=CONFIG.HP[nt];
    p.hp = Math.round(p.maxHp*CONFIG.PROMOTION_HP_FRACTION);
    say(st,'sys',`Promoted to ${NAME[nt]} at ${sqName(mv.to)} — ${p.hp}/${p.maxHp} HP.`);
  }

  if (p.type==='k'){ st.castling[p.color+'k']=false; st.castling[p.color+'q']=false; }
  if (p.type==='r'){
    if(mv.from===0) st.castling.wq=false; if(mv.from===7) st.castling.wk=false;
    if(mv.from===56) st.castling.bq=false; if(mv.from===63) st.castling.bk=false;
  }
  if(mv.to===0) st.castling.wq=false; if(mv.to===7) st.castling.wk=false;
  if(mv.to===56) st.castling.bq=false; if(mv.to===63) st.castling.bk=false;

  if (mv.double){ st.ep=(mv.from+mv.to)/2; st.epPawn=id; } else { st.ep=null; st.epPawn=null; }

  // Fifty-move clock: any capture or pawn move resets it.
  if (mv.capture!=null || p.type==='p' || mv.promote) st.halfmove = 0; else st.halfmove++;

  /* Recoil can never be lethal, and that is a RULES requirement, not a mercy.
     Move legality is judged on the position after the move; if recoil then killed
     the capturer, a piece that captured *along its own pin line* would vanish and
     expose its king — a move the engine had already certified legal. Clamping to
     leave 1 HP closes that hole and reads better anyway: capturing maims you, it
     does not kill you. */
  if (recoil>0 && (p.type!=='k' || CONFIG.CAPTURE_RECOIL_HITS_KING)) {
    const safe = Math.min(Math.round(recoil), p.hp - 1);
    if (safe > 0) applyDamage(st, id, safe, { source:'Capture recoil' });
    else say(st,'sys',`${label(p)} survives the impact on ${sqName(mv.to)} with 1 HP.`);
  }

  st.turnState.movedId = id;
  st.turnState.san = san;
  return true;
}

/*═══════════════════════════════════════════════════════════════════════════
  7. WEAPONS — sector, aim solver, ballistics
═══════════════════════════════════════════════════════════════════════════*/

const weaponSpeed = (w) => (w.speed!=null ? w.speed : Math.sqrt(CONFIG.GRAVITY*w.maxRange));
const muzzleY = (p) => {
  const w = CONFIG.WEAPONS[p.type];
  return CONFIG.HEIGHT[p.type] * ((w && w.muzzleFrac) || CONFIG.MUZZLE_HEIGHT_FRACTION);
};

/*───────────────────────────────────────────────────────────────────────────
  CHESS-CULTURE DAMAGE. Each bonus is a real chess principle. damageProfile()
  returns the itemised breakdown so the hover panel and the log can show the
  player exactly why a number changed — without that, these are hidden math.
───────────────────────────────────────────────────────────────────────────*/

const FIANCHETTO = new Set([mkSq(1,1), mkSq(6,1), mkSq(1,6), mkSq(6,6)]); // b2 g2 b7 g7
const squareTint = (sq) => (fileOf(sq) + rankOf(sq)) & 1;
const relRank    = (p) => (p.color==='w' ? rankOf(p.sq) : 7-rankOf(p.sq));
const fullTurn   = (st) => Math.floor(st.ply/2) + 1;
const pieceCount = (st,c) => Object.values(st.pieces).filter(p=>p.color===c).length;

/** Guns are cold until both sides have completed the opening. */
const gunsLive = (st) => st.ply >= CONFIG.GUNS_LIVE_AFTER_MOVES * 2;
/** Steinitz was right — but only once the board has emptied out. */
const kingArmed = (st) =>
  pieceCount(st,'w') <= CONFIG.KING_ARMS_AT_PIECES && pieceCount(st,'b') <= CONFIG.KING_ARMS_AT_PIECES;

function weaponOf(p, st) {
  const w = CONFIG.WEAPONS[p.type];
  if (!w) return null;
  if (w.endgameOnly && !(st && kingArmed(st))) return null;
  return w;
}

/** Is this pawn defended by another friendly pawn? (a chained pawn hits twice as hard) */
function pawnIsChained(st, p) {
  const back = p.color==='w' ? -1 : 1;
  const f0 = fileOf(p.sq), r0 = rankOf(p.sq);
  for (const df of [-1,1]) {
    const f=f0+df, r=r0+back;
    if (!onBoard(f,r)) continue;
    const id = st.board[mkSq(f,r)];
    if (id!=null && st.pieces[id].color===p.color && st.pieces[id].type==='p') return true;
  }
  return false;
}

/**
 * Open / half-open / blocked, judged along ONE line. A rook firing sideways down
 * an open rank must be graded on that rank — reading its file regardless both
 * misdescribed the shot and quietly gutted the rook, whose file is usually
 * blocked by its own pawn in the opening.
 */
function lineState(st, sq, color, alongRank) {
  let own=false, foe=false;
  for (let i=0;i<8;i++){
    const s2 = alongRank ? mkSq(i, rankOf(sq)) : mkSq(fileOf(sq), i);
    const id = st.board[s2];
    if (id==null || st.pieces[id].type!=='p') continue;
    if (st.pieces[id].color===color) own=true; else foe=true;
  }
  const what = alongRank ? 'rank' : 'file';
  if (own) return { name:'Blocked '+what,   mult:CONFIG.BONUS.ROOK_FILE_BLOCKED };
  if (foe) return { name:'Half-open '+what, mult:CONFIG.BONUS.ROOK_FILE_HALFOPEN };
  return     { name:'Open '+what,     mult:CONFIG.BONUS.ROOK_FILE_OPEN };
}
/** Back-compat helper used by the console/debug surface. */
const fileState = (st, file, color) => lineState(st, mkSq(file,0), color, false);

/** A friendly rook doubled on the same file or rank with nothing between. */
function batteryPartner(st, p) {
  for (const id in st.pieces) {
    const q = st.pieces[id];
    if (q.id===p.id || q.color!==p.color || q.type!=='r') continue;
    const sameFile = fileOf(q.sq)===fileOf(p.sq), sameRank = rankOf(q.sq)===rankOf(p.sq);
    if (!sameFile && !sameRank) continue;
    const step = sameFile ? (q.sq>p.sq ? 8 : -8) : (q.sq>p.sq ? 1 : -1);
    let clear = true;
    for (let s=p.sq+step; s!==q.sq; s+=step) if (st.board[s]!=null) { clear=false; break; }
    if (clear) return q;
  }
  return null;
}

/**
 * @param ctx.targetSq  square being hit — needed for the bishop's colour lock
 * @param ctx.noBattery internal, stops rook batteries recursing
 */
function damageProfile(st, p, ctx = {}) {
  const w = weaponOf(p, st);
  if (!w) return { base:0, mods:[], total:0, label:'—', armed:false };
  const B = CONFIG.BONUS;
  const mods = [];
  const base = w.damage;
  let total = base;

  if (p.type==='p') {
    const adv = Math.max(0, relRank(p) - 3);
    if (adv>0){ const add = adv*B.PAWN_PER_RANK;
      mods.push({ name:`Passed pawn +${adv} rank${adv>1?'s':''}`, text:`+${add}` }); total += add; }
    if (pawnIsChained(st,p)){ mods.push({ name:'Chained pawn', text:'×2' }); total *= B.PAWN_CHAIN; }
  }
  else if (p.type==='n') {
    const rr = relRank(p);
    if (rr===4 || rr===5){ mods.push({ name:'Outpost', text:'×2' }); total *= B.KNIGHT_OUTPOST; }
    const f = fileOf(p.sq);
    if (f===0 || f===7){ mods.push({ name:'Knight on the rim', text:'×0.5' }); total *= B.KNIGHT_RIM; }
  }
  else if (p.type==='b') {
    if (FIANCHETTO.has(p.sq)){ mods.push({ name:'Fianchetto', text:'×2' }); total *= B.BISHOP_FIANCHETTO; }
    if (Object.values(st.pieces).filter(q=>q.color===p.color&&q.type==='b').length>=2){
      mods.push({ name:'Bishop pair', text:'+25%' }); total *= B.BISHOP_PAIR; }
    if (ctx.targetSq!=null && squareTint(ctx.targetSq)!==squareTint(p.sq)){
      mods.push({ name:'Wrong colour complex', text: B.BISHOP_OFF_COLOUR===0?'×0':'×'+B.BISHOP_OFF_COLOUR });
      total *= B.BISHOP_OFF_COLOUR; }
  }
  else if (p.type==='r') {
    // Which line is this shot travelling down? With no target (hover panel) show
    // the rook's better line, so the reading reflects what it could actually do.
    let alongRank;
    if (ctx.targetSq != null) {
      alongRank = Math.abs(fileOf(ctx.targetSq)-fileOf(p.sq)) > Math.abs(rankOf(ctx.targetSq)-rankOf(p.sq));
    } else {
      alongRank = lineState(st,p.sq,p.color,true).mult > lineState(st,p.sq,p.color,false).mult;
    }
    const fs = lineState(st, p.sq, p.color, alongRank);
    mods.push({ name:fs.name, text:'×'+fs.mult }); total *= fs.mult;
    if (relRank(p)===6){ mods.push({ name:'Pigs on the 7th', text:'+50%' }); total *= B.ROOK_SEVENTH; }
  }
  else if (p.type==='q') {
    if (fullTurn(st) < B.QUEEN_EARLY_UNTIL){
      mods.push({ name:`Early queen (before move ${B.QUEEN_EARLY_UNTIL})`, text:'×0.5' });
      total *= B.QUEEN_EARLY; }
  }

  // Clamp the stacked multiplier, recomputed from base so the cap is exact rather
  // than order-dependent. Penalties (<1) are never capped — you can always be
  // punished in full.
  if (base > 0 && total/base > B.MAX_BONUS_MULT) {
    total = base * B.MAX_BONUS_MULT;
    mods.push({ name:`Capped at ×${B.MAX_BONUS_MULT}`, text:'—' });
  }

  // A rook battery is a SECOND GUN firing, not a bonus on the first, so it is
  // added after the cap. Both barrels then go on cooldown.
  if (p.type==='r' && !ctx.noBattery) {
    const partner = batteryPartner(st,p);
    if (partner) {
      const o = damageProfile(st, partner, { ...ctx, noBattery:true });
      mods.push({ name:`Battery with ${sqName(partner.sq)}`, text:`+${o.total}` });
      total += o.total;
    }
  }
  return { base, mods, total: Math.max(0, Math.round(total)), label:w.label, armed:true };
}

function sectorCenters(p, st) {
  const w = weaponOf(p, st) || CONFIG.WEAPONS[p.type]; if(!w) return null;
  const fwd = p.color==='w' ? 0 : Math.PI;
  switch (w.sector) {
    case 'pawnDiag':   return [normAng(fwd+45*D2R), normAng(fwd-45*D2R)];
    case 'diagonal':   return [45*D2R, 135*D2R, -135*D2R, -45*D2R];
    case 'orthogonal': return [0, Math.PI/2, Math.PI, -Math.PI/2];
    default:           return null;
  }
}
const SECTOR_TEXT = { pawnDiag:'forward diagonals', diagonal:'diagonals', orthogonal:'ranks & files', any:'any direction' };

function clampYawToSector(yaw, centers, half) {
  if (!centers) return normAng(yaw);
  let best=centers[0], bd=Infinity;
  for (const c of centers){ const d=Math.abs(angDiff(yaw,c)); if(d<bd){bd=d;best=c;} }
  return normAng(best + clamp(angDiff(yaw,best), -half, half));
}

/**
 * THE AIM SOLVER. Give it a world point the player is pointing at; it returns a
 * firing solution that actually lands there.
 *
 * This replaces the old relative-mouse yaw accumulator, which snapped between
 * sector wedges and could stall against the screen edge. Aim is now absolute:
 * the reticle sits under the cursor and the launch angle is solved from physics.
 */
function aimAt(st, shooterId, px, pz, arcPref) {
  const p = st.pieces[shooterId], w = weaponOf(p, st);
  const [sx,,sz] = worldOf(p.sq);
  const y0 = muzzleY(p);

  let dx = px-sx, dz = pz-sz;
  let d = Math.hypot(dx,dz);
  if (d < 1e-4) { const f=yawDir(p.color==='w'?0:Math.PI); dx=f[0]; dz=f[1]; d=1; }

  const yaw = clampYawToSector(yawOf(dx,dz), sectorCenters(p), w.sectorHalfDeg*D2R);
  const maxR = isFinite(w.maxRange) ? w.maxRange : 11.5;
  d = clamp(d, w.minRange || CONFIG.MIN_RANGE, maxR);

  const [ux,uz] = yawDir(yaw);
  const tx = sx+ux*d, tz = sz+uz*d;

  // Aim low on a body, not the floor behind it, when a piece stands on the target
  // square — low enough that anything closer in the line still blocks the shot.
  const tsq = sqOfWorld(tx,tz);
  const occ = tsq>=0 ? st.board[tsq] : null;
  const ty = occ!=null ? CONFIG.HEIGHT[st.pieces[occ].type]*CONFIG.TARGET_BODY_FRACTION : 0;

  let elev, arcUsed='flat';
  if (w.hitscan) {
    // A level sweep: the beam sits below every piece's shoulder, so it really does
    // hit everything along the line — which is the whole point of the weapon.
    elev = 0;
  } else if (w.gravity===0) {
    elev = Math.atan2(ty-y0, d);
  } else {
    const v=weaponSpeed(w), g=CONFIG.GRAVITY;
    const k = g*d*d/(2*v*v);
    const disc = d*d - 4*k*(k + ty - y0);
    if (disc <= 0) { elev = 45*D2R; arcUsed='lob'; }
    else {
      const s = Math.sqrt(disc);
      const lo = Math.atan((d-s)/(2*k)), hi = Math.atan((d+s)/(2*k));
      const wantHigh = w.arcBand==='lob' || (w.arcBand==='both' && arcPref==='lob');
      elev = wantHigh ? hi : lo;
      arcUsed = wantHigh ? 'lob' : 'flat';
    }
  }
  return { yaw, elev, dist:d, x:tx, y:ty, z:tz, arcUsed };
}

function obstaclesOf(st, excludeId) {
  const list=[];
  for (const id in st.pieces) {
    if (id===excludeId) continue;
    const p=st.pieces[id];
    if (p.type==='k' && !CONFIG.KING.BLOCKS_PROJECTILES) continue;
    const [x,,z]=worldOf(p.sq);
    list.push({kind:'piece',id,x,z,h:CONFIG.HEIGHT[p.type],r:CONFIG.PIECE_RADIUS});
  }
  return list;
}

const OUT = 5.6;

/** Resolve a shot's flight deterministically; the tracer is animated along it later. */
function simulateShot(st, shooterId, yaw, elev, opts={}) {
  const p = st.pieces[shooterId], w = weaponOf(p, st);
  const [wx,,wz] = worldOf(p.sq);
  const y0 = muzzleY(p);
  const [dxu,dzu] = yawDir(yaw);
  const ce = Math.cos(elev), se = Math.sin(elev);
  const obstacles = opts.noCollide ? [] : obstaclesOf(st, shooterId);
  const pts = [[wx,y0,wz]];
  const hits = [];

  if (w.hitscan) {
    const step=0.07, seen=new Set();
    let x=wx,y=y0,z=wz;
    for (let d=step; d<=26; d+=step) {
      x=wx+dxu*ce*d; y=y0+se*d; z=wz+dzu*ce*d;
      pts.push([x,y,z]);
      for (const ob of obstacles) {
        if (ob.kind!=='piece' || seen.has(ob.id)) continue;
        if (y<=ob.h && y>=0 && (x-ob.x)**2+(z-ob.z)**2 < ob.r*ob.r) { seen.add(ob.id); hits.push({id:ob.id}); }
      }
      if (y<=0) return {pts,impact:{x,y:0,z},hits,beam:true,ground:true};
      if (Math.abs(x)>OUT||Math.abs(z)>OUT) return {pts,impact:{x,y,z},hits,beam:true,offBoard:true};
    }
    return {pts,impact:{x,y,z},hits,beam:true,offBoard:true};
  }

  const sp = weaponSpeed(w);
  let vx=dxu*ce*sp, vy=se*sp, vz=dzu*ce*sp;
  let x=wx,y=y0,z=wz,horiz=0;
  const g = CONFIG.GRAVITY*w.gravity;
  const dt = opts.dt || CONFIG.SIM_DT;

  for (let t=0; t<CONFIG.SIM_MAX_TIME; t+=dt) {
    const px2=x, pz2=z;
    vy-=g*dt; x+=vx*dt; y+=vy*dt; z+=vz*dt;
    horiz += Math.hypot(x-px2, z-pz2);
    pts.push([x,y,z]);
    // A mortar ignores cover by only becoming solid once it is falling.
    if ((!w.ignoresCover || vy<0) && y>=0) {
      for (const ob of obstacles) {
        if (y<=ob.h && (x-ob.x)**2+(z-ob.z)**2 < ob.r*ob.r) {
          if (ob.kind==='piece') hits.push({id:ob.id});
          return {pts,impact:{x,y,z},hits,blockedBy:ob.kind};
        }
      }
    }
    if (y<=0){ pts[pts.length-1]=[x,0,z]; return {pts,impact:{x,y:0,z},hits,ground:true}; }
    if (horiz>=w.maxRange) return {pts,impact:{x,y,z},hits,capped:true};
    if (Math.abs(x)>OUT||Math.abs(z)>OUT) return {pts,impact:{x,y,z},hits,offBoard:true};
  }
  return {pts,impact:{x,y,z},hits,offBoard:true};
}

/**
 * Every square this piece may shoot at, each pre-resolved so the UI can show
 * up front whether the shot is CLEAR or BLOCKED — and by what. This is what makes
 * "can I shoot past my own piece?" answerable without trial and error: switch to
 * LOB and the blocked squares turn clear.
 */
function targetOptions(st, shooterId, arcPref) {
  const p = st.pieces[shooterId]; if(!p) return [];
  const w = weaponOf(p, st); if(!w) return [];
  const centers = sectorCenters(p), half = w.sectorHalfDeg*D2R;
  const maxR = isFinite(w.maxRange) ? w.maxRange : 11.5;
  const [sx,,sz] = worldOf(p.sq);
  const out = [];

  for (let sq=0; sq<64; sq++) {
    if (sq === p.sq) continue;
    const [tx,,tz] = worldOf(sq);
    const d = Math.hypot(tx-sx, tz-sz);
    if (d < (w.minRange || CONFIG.MIN_RANGE) || d > maxR + 0.01) continue;
    if (centers) {
      const yaw = yawOf(tx-sx, tz-sz);
      if (!centers.some(c => Math.abs(angDiff(yaw,c)) <= half + 1e-6)) continue;
    }
    /* A line piece shoots EXACTLY where it moves.
       The aiming cone used to let a bishop snipe 25 squares that were not on any
       of its diagonals. Players read that as "the bishop sees that square", so
       when a shot cleared a blocker they expected check — and the rules, quite
       correctly, disagreed, because no line had opened. Locking the gun to the
       piece's real chess lines makes the board mean what it looks like:
       clear the line, and it IS check. */
    if (w.lineLocked) {
      const df = fileOf(sq)-fileOf(p.sq), dr = rankOf(sq)-rankOf(p.sq);
      const diag = Math.abs(df) === Math.abs(dr);
      const ortho = (df === 0) !== (dr === 0);
      if (w.sector==='diagonal'   && !diag)  continue;
      if (w.sector==='orthogonal' && !ortho) continue;
      if (w.sector==='pawnDiag') {
        const fwd = p.color==='w' ? 1 : -1;
        if (!(diag && dr*fwd > 0)) continue;
      }
    }
    const sol = aimAt(st, shooterId, tx, tz, arcPref);
    if (sqOfWorld(sol.x, sol.z) !== sq) continue;      // clamped elsewhere
    const sim = simulateShot(st, shooterId, sol.yaw, sol.elev);

    let status='clear', blockerId=null;
    if (w.hitscan) {
      status = 'clear';                                 // a beam is never blocked
    } else if (sim.hits.length) {
      const hit = st.pieces[sim.hits[0].id];
      if (hit && hit.sq === sq) status='clear';
      else { status='blocked'; blockerId = sim.hits[0].id; }
    } else {
      const isq = sqOfWorld(sim.impact.x, sim.impact.z);
      if (isq !== sq) status='blocked';
    }
    out.push({ sq, sol, sim, status, blockerId });
  }
  return out;
}

/** Log a hit with its bonus breakdown, so damage is never mysterious. */
function sayHit(st, src, prof, targetLabel, dealt) {
  const bits = prof.mods.map(m=>`${m.name} ${m.text}`).join(', ');
  say(st,'dmg',`${src} → ${targetLabel}: ${prof.base} base${bits?` · ${bits}`:''} = ${dealt}`);
}

/**
 * What this shot WILL do, computed without firing it. The whole design is
 * conditional damage bonuses, so hiding the number until after you commit was a
 * design bug: this feeds the aim HUD so you decide with the number in front of you.
 * Mirrors resolveShot exactly — there is a regression test asserting they agree.
 */
function shotPreview(st, shooterId, sim) {
  const shooter = st.pieces[shooterId]; if(!shooter) return [];
  const w = weaponOf(shooter, st); if(!w) return [];
  const out = [], direct = new Set();

  const push = (target, raw, note, prof) => {
    if (!target) return;
    let dmg = raw, blocked = null;
    if (raw <= 0) { dmg = 0; blocked = 'none'; }          // e.g. bishop, wrong colour complex
    else if (target.type==='k' && CONFIG.KING.IMMUNE_TO_PROJECTILES) { dmg = 0; blocked = 'immune'; }
    else if (target.color===shooter.color) {
      if (!st.settings.friendlyFire) { dmg = 0; blocked = 'ff-off'; }
      else dmg = Math.max(1, Math.round(dmg * CONFIG.FRIENDLY_FIRE_MULT));
    } else dmg = Math.max(1, Math.round(dmg));
    out.push({ id:target.id, type:target.type, color:target.color, sq:target.sq,
               hp:target.hp, maxHp:target.maxHp, raw, dmg, lethal: dmg >= target.hp,
               friendly: target.color===shooter.color, blocked, note, prof });
  };

  if (w.prongs > 0) {
    const R = CONFIG.BONUS.KNIGHT_PRONG_RADIUS;
    Object.values(st.pieces)
      .filter(q => q.color !== shooter.color && q.type !== 'k')
      .map(q => { const [x,,z]=worldOf(q.sq);
                  return { q, d: Math.hypot(x-sim.impact.x, z-sim.impact.z) }; })
      .filter(o => o.d <= R).sort((a,b)=>a.d-b.d).slice(0, w.prongs)
      .forEach((o,i) => {
        const prof = damageProfile(st, shooter, { targetSq:o.q.sq });
        if (i > 0) {
          prof.mods.push({ name:'Split prong', text:'×'+CONFIG.BONUS.KNIGHT_PRONG_FALLOFF });
          prof.total = Math.max(1, Math.round(prof.total * CONFIG.BONUS.KNIGHT_PRONG_FALLOFF));
        }
        push(o.q, prof.total, i > 0 ? 'split prong' : 'fork', prof);
      });
  } else {
    let depth = 0;
    for (const h of sim.hits) {
      const t = st.pieces[h.id]; if(!t) continue;
      direct.add(h.id);
      const prof = damageProfile(st, shooter, { targetSq:t.sq });
      if (w.hitscan && depth > 0) {
        const f = Math.pow(CONFIG.BONUS.BISHOP_PIERCE_FALLOFF, depth);
        prof.mods.push({ name:`Pierced ${depth} deep`, text:'×'+f.toFixed(2) });
        prof.total = Math.max(1, Math.round(prof.total * f));
      }
      depth++;
      push(t, prof.total, depth > 1 ? 'pierced' : null, prof);
    }
  }

  if (w.splashSquares > 0 && w.splashDamage > 0) {
    const isq = sqOfWorld(sim.impact.x, sim.impact.z);
    if (isq >= 0) {
      const f0 = fileOf(isq), r0 = rankOf(isq);
      for (const id of Object.keys(st.pieces)) {
        if (direct.has(id) && !CONFIG.SPLASH_HITS_DIRECT_TARGET) continue;
        const q = st.pieces[id];
        if (Math.max(Math.abs(fileOf(q.sq)-f0), Math.abs(rankOf(q.sq)-r0)) <= w.splashSquares)
          push(q, w.splashDamage, 'splash', { base:w.splashDamage, mods:[], total:w.splashDamage });
      }
    }
  }
  return out;
}

function resolveShot(st, shooterId, sim) {
  const shooter = st.pieces[shooterId]; if(!shooter) return;
  const w = weaponOf(shooter, st); if(!w) return;
  const src = `${SIDE[shooter.color]} ${NAME[shooter.type]} ${w.label}`;

  /* A shot is ONE instant. Every number is computed against the board as it was
     when the trigger was pulled, then applied — otherwise a beam's first kill
     silently changes what its second hit does (losing the bishop-pair bonus, say),
     which diverged from the damage the player was shown before firing. */
  const hits = shotPreview(st, shooterId, sim);

  if (w.prongs > 0) {
    const forks = hits.filter(h => h.note==='fork' || h.note==='split prong');
    if (!forks.length) say(st,'shot','Fork shot finds nothing in the blast area.');
    else if (forks.length===1) say(st,'shot','Fork shot catches only one target.');
    else say(st,'shot',`FORK — the shell splits and hits ${forks.length} pieces at once.`);
  } else if (w.hitscan) {
    for (const h of hits) {
      if (h.note==='splash') continue;
      const [hx,,hz] = worldOf(h.sq);
      fx(st,'blast',{x:hx, y:CONFIG.HEIGHT[h.type]*0.5, z:hz, power:w.blast, color:w.tracer});
    }
  }

  for (const h of hits) {
    const t = st.pieces[h.id]; if (!t) continue;          // already dead this shot
    const tl = `${SIDE[t.color]} ${NAME[t.type]} ${sqName(t.sq)}`;
    if (h.raw <= 0) { say(st,'sys',`${src} → ${tl}: wrong colour complex, no damage.`); continue; }
    const label2 = h.note==='splash' ? src+' splash' : src;
    const dealt = applyDamage(st, h.id, h.raw,
      { projectile:true, srcColor:shooter.color, source:label2, profile:h.prof });
    if (dealt>0 && h.note!=='splash' && h.prof) sayHit(st, src, h.prof, tl, dealt);
  }

  // Firing is what puts a piece on cooldown; a rook battery burns both barrels.
  // Re-read: the shooter can kill itself with its own splash or friendly fire.
  const alive = st.pieces[shooterId];
  if (alive) {
    alive.cooldown = w.cooldown;
    if (alive.type==='r') {
      const partner = batteryPartner(st, alive);
      if (partner) { partner.cooldown = CONFIG.WEAPONS.r.cooldown;
        say(st,'sys',`Battery fired — ${label(partner)} also goes on cooldown.`); }
    }
  }

  // A shot can leave the shooter's own side with no legal move at all: friendly
  // fire or recoil kills the last piece that could move, or removes a blocker so
  // the king is suddenly exposed. The turn cannot continue, so the position is
  // settled the way chess settles it: no moves in check is mate, otherwise
  // stalemate. (Check shots never come through here; they resolve in advanceTurn.)
  const side = shooter.color;
  if (!st.gameOver && legalMoves(st, side).length === 0) {
    if (inCheck(st, side)) endGame(st, other(side), 'checkmate');
    else                   endGame(st, null, 'stalemate');
  }

  if (!sim.offBoard) {
    fx(st,'blast',{x:sim.impact.x, y:Math.max(0.05,sim.impact.y), z:sim.impact.z,
                   power:w.blast, color:w.tracer});
    st.scorch.push({x:sim.impact.x, z:sim.impact.z, until:st.ply+CONFIG.SCORCH_PLIES,
                    r:Math.max(0.32, w.splashSquares*0.7)});
  }
  if (!sim.hits.length && !w.prongs) {
    const isq = sqOfWorld(sim.impact.x, sim.impact.z);
    say(st,'shot', sim.offBoard || isq<0 ? 'Shot sails off the board.'
      : `Shot lands on empty ground at ${sqName(isq)}.`);
  }
}

/**
 * CHECK IS A FREE SHOT. Every piece currently giving check fires its own weapon at
 * the king for its own damage and goes on its own cooldown — so a second check
 * from the same piece costs the attacker nothing and deals nothing. Perpetual
 * check limits itself; no separate check-damage system, no special numbers.
 * A discovered check fires two guns at once, because two pieces are checking.
 */
function fireCheckShots(st, color) {
  if (!st.settings.checkShots) return;    // pure-chess mode: check costs no HP
  const k = findKing(st, color); if(!k || st.gameOver) return;
  const checkers = [];
  for (const id in st.pieces) {
    const p = st.pieces[id];
    if (p.color === color || p.type === 'k') continue;
    if (pieceMoves(st, id, { noCastle:true }).some(m => m.to === k.sq)) checkers.push(p);
  }
  if (!checkers.length) return;
  say(st,'crip',`CHECK — ${checkers.length} piece${checkers.length>1?'s open fire':' opens fire'} on ${SIDE[color]}'s king.`);

  for (const c of checkers) {
    const w = weaponOf(c, st);
    if (!w) { say(st,'sys',`${label(c)} gives check but has no weapon.`); continue; }
    if (c.cooldown > 0) {
      say(st,'sys',`${label(c)} is reloading (${c.cooldown}) — its check does no damage.`);
      continue;
    }
    const prof = damageProfile(st, c, { targetSq:k.sq });
    if (CONFIG.CHECK_SHOT_MULT !== 1 && prof.total > 0)
      prof.mods.push({ name:'Check shot', text:'×'+CONFIG.CHECK_SHOT_MULT });
    const dealt = Math.max(0, Math.round(prof.total * CONFIG.CHECK_SHOT_MULT));
    c.cooldown = w.cooldown;
    const [kx,,kz] = worldOf(k.sq);
    fx(st,'blast',{ x:kx, y:CONFIG.HEIGHT.k*0.5, z:kz, power:w.blast, color:w.tracer });
    if (dealt <= 0) { say(st,'sys',`${label(c)}'s check shot does nothing (${prof.mods.map(m=>m.name).join(', ')||'no damage'}).`); continue; }
    sayHit(st, `${label(c)} check shot`, prof, `${SIDE[color]} king`, dealt);
    applyDamage(st, k.id, dealt, { checkShot:true, srcColor:c.color, source:'Check shot' });
    if (st.gameOver) return;
  }
}

/*═══════════════════════════════════════════════════════════════════════════
  8. TURN FLOW
═══════════════════════════════════════════════════════════════════════════*/

/**
 * Fire BEFORE you move — the move is what ends your turn, so there is no
 * "end turn" button to forget. A piece that has fired cannot also be the piece
 * you move.
 */
const canFire = (st,p) =>
  !!p && !st.gameOver && p.color===st.turn && !!weaponOf(p, st) && p.cooldown===0 && gunsLive(st) &&
  !st.turnState.firedId && !st.turnState.forfeited && !st.turnState.movedId;

const canMovePiece = (st,p) =>
  !!p && !st.gameOver && p.color===st.turn && !st.turnState.movedId && st.turnState.firedId!==p.id;

/**
 * Classic chess position key: layout + side to move + rights. Deliberately excludes
 * HP and cooldowns — that is what lets it catch perpetual check, where the position
 * repeats while the king's HP ticks down.
 */
function positionKey(st) {
  let s = '';
  for (let sq=0; sq<64; sq++) {
    const id = st.board[sq];
    s += id==null ? '.' : (st.pieces[id].color==='w'
      ? st.pieces[id].type.toUpperCase() : st.pieces[id].type);
  }
  return s + '|' + st.turn + '|' + (st.castling.wk?'K':'') + (st.castling.wq?'Q':'')
           + (st.castling.bk?'k':'') + (st.castling.bq?'q':'') + '|' + (st.ep==null?'-':st.ep);
}

function beginTurn(st) {
  st.turnState = { movedId:null, firedId:null, forfeited:false, san:null };
  const c = st.turn;
  if (st.gameOver) return;
  say(st,'sys',`— ${SIDE[c]} to move —`);

  // Draws are exactly chess draws: no stalemate bleed, no sudden-death timer.
  // Mate and stalemate are settled FIRST: a game that is already finished on the
  // board cannot be taken away by a counter. Chess says a move that gives mate
  // gives mate even when it completes the fifty-move count.
  const moves = legalMoves(st,c);
  if (moves.length===0) {
    if (inCheck(st,c)) endGame(st, other(c), 'checkmate');
    else               endGame(st, null, 'stalemate');
    return;
  }

  const key = positionKey(st);
  st.posCounts[key] = (st.posCounts[key]||0) + 1;
  if (st.posCounts[key] >= CONFIG.REPETITION_DRAW) {
    endGame(st, null, `threefold repetition`); return;
  }
  if (st.halfmove >= CONFIG.FIFTY_MOVE_PLIES) {
    endGame(st, null, `the fifty-move rule`); return;
  }

  if (st.ply === CONFIG.GUNS_LIVE_AFTER_MOVES*2)
    say(st,'sys',`GUNS LIVE — both sides have made ${CONFIG.GUNS_LIVE_AFTER_MOVES} moves. Weapons are hot.`);
  if (kingArmed(st) && !st.kingsArmedAnnounced) {
    st.kingsArmedAnnounced = true;
    say(st,'sys',`The kings arm themselves — ${CONFIG.KING_ARMS_AT_PIECES} pieces or fewer a side. The king is a fighting piece.`);
  }
}

function advanceTurn(st) {
  if (st.gameOver) return;
  const c = st.turn;

  if (st.turnState.san) {
    const opp = other(c);
    let san = st.turnState.san;
    if (inCheck(st,opp)) san += legalMoves(st,opp).length===0 ? '#' : '+';
    const n = Math.floor(st.ply/2);
    if (c==='w') st.moveList.push({n:n+1, w:san, b:null});
    else if (st.moveList.length) st.moveList[st.moveList.length-1].b = san;
    else st.moveList.push({n:n+1, w:'…', b:san});
  } else if (c==='w') st.moveList.push({n:Math.floor(st.ply/2)+1, w:'—', b:null});
  else if (st.moveList.length) st.moveList[st.moveList.length-1].b = '—';

  // Cooldowns tick down on their owner's turn. That is the entire shot economy:
  // no charge state, no activation — a piece is ready unless it is reloading.
  for (const id of Object.keys(st.pieces)) {
    const p = st.pieces[id];
    if (p.color===c && p.cooldown>0) p.cooldown--;
  }

  // Check is resolved AFTER the tick, so a piece that just checked is genuinely
  // reloading next time and a perpetual check pays nothing.
  if (inCheck(st, other(c))) fireCheckShots(st, other(c));
  if (st.gameOver) return;

  st.ply++;
  st.scorch = st.scorch.filter(s=>s.until>=st.ply);
  if (st.banner && st.banner.until < st.ply) st.banner = null;
  st.fx = [];
  st.turn = other(c);
  beginTurn(st);
}

  units and stay well inside a 1.0 square; heights are fractions of
  CONFIG.HEIGHT so the visual always matches the collision cylinder.

const PROFILE = {

  r: [[0,0],[.265,0],[.275,.03],[.235,.08],[.200,.16],[.190,.60],[.235,.66],
      [.250,.72],[.250,1],[0,1]],
  b: [[0,0],[.240,0],[.250,.028],[.205,.07],[.115,.14],[.095,.40],[.145,.455],
      [.105,.505],[.125,.58],[.158,.70],[.148,.80],[.100,.885],[.055,.945],[0,.97]],
  q: [[0,0],[.260,0],[.270,.025],[.225,.065],[.125,.13],[.105,.42],[.165,.475],
      [.120,.525],[.145,.60],[.185,.70],[.200,.775],[.135,.815],[.155,.855],

};

/** Stylised horse head, extruded from a side profile — reads far better than boxes. */
const KNIGHT_HEAD = (() => {
  const pts = [[-.100,0],[-.145,.130],[-.135,.270],[-.085,.345],[-.105,.430],
               [-.020,.345],[ .025,.420],[ .065,.325],[ .135,.275],[ .185,.185],
               [ .195,.105],[ .135,.062],[ .062,.092],[ .012,.042],[ .045,0]];
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:0.15, curveSegments:2,
    bevelEnabled:true, bevelSize:0.014, bevelThickness:0.014, bevelSegments:2 });
  g.translate(0, 0, -0.075);
  g.computeVertexNormals();
  return g;
})();

const lathe = (type) => {
  const h = CONFIG.HEIGHT[type];
  const g = new THREE.LatheGeometry(PROFILE[type].map(([r,y]) => new THREE.Vector2(r, y*h)), 40);
  g.computeVertexNormals();
  return g;
};

const GEO = {
  body: Object.fromEntries(TYPES.map(t => [t, lathe(t)])),
  tile: new THREE.BoxGeometry(0.965, 0.055, 0.965),
  ring: (i,o,s=64,st=0,l=Math.PI*2) => new THREE.RingGeometry(i,o,s,1,st,l),
  batt: new THREE.BoxGeometry(0.085, 0.075, 0.085),
  crossV: new THREE.BoxGeometry(0.048, 0.135, 0.048),
  crossH: new THREE.BoxGeometry(0.115, 0.045, 0.045),
  pip: new THREE.SphereGeometry(0.038, 10, 8),
  bar: new THREE.PlaneGeometry(1, 1),
  debris: new THREE.BoxGeometry(1, 1, 1),
  ball: new THREE.SphereGeometry(1, 14, 12),
};
const ringCache = new Map();
const flatRing = (i,o,s,st,l) => {
  const k = [i,o,s,st,l].join('|');
  if (!ringCache.has(k)) ringCache.set(k, GEO.ring(i,o,s,st,l));
  return ringCache.get(k);
};

const COL = { ...THEMES.ivory.d3, accent:'#c2662f', gold:'#c79418', red:'#b3402e', green:'#5e8a4e' };

function applyTheme(name) {
  const t = THEMES[name] || THEMES.ivory;
  Object.assign(COL, t.d3, { accent:t.ui.accent, gold:t.ui.gold, red:t.ui.red, green:t.ui.green });
  Object.assign(LIT, t.lit);
  const root = document.documentElement;
  for (const [k,v] of Object.entries(t.ui)) root.style.setProperty('--'+k, v);
  root.style.setProperty('color-scheme', name==='walnut'||name==='carbon' ? 'dark' : 'light');
  return name;
}

const hpColor = (f) => (f>0.5 ? '#5e8a4e' : f>0.25 ? '#c79418' : '#b3402e');
const noPick = () => null;

/*═══════════════════════════════════════════════════════════════════════════
  10. BOARD
═══════════════════════════════════════════════════════════════════════════*/

function useCoordTexture(themeName) {
  return useMemo(() => {
    const S=1024, m=Math.round(S*0.0605);
    const cv=document.createElement('canvas'); cv.width=cv.height=S;
    const g=cv.getContext('2d');
    g.clearRect(0,0,S,S);
    g.fillStyle=COL.coord;
    g.font=`500 ${Math.round(m*0.44)}px ui-sans-serif, system-ui, sans-serif`;
    g.textAlign='center'; g.textBaseline='middle';
    const inner=S-2*m, cell=inner/8;
    for(let i=0;i<8;i++){
      const cx=m+cell*(i+0.5);
      g.fillText(FILES[i], cx, m*0.5); g.fillText(FILES[i], cx, S-m*0.5);
      const cy=m+cell*(i+0.5);
      g.fillText(String(8-i), m*0.5, cy); g.fillText(String(8-i), S-m*0.5, cy);
    }
    const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
  }, [themeName]);
}

function Board({ onSquare, onTileHover, hints, selSq, lastMove, themeName }) {
  const coord = useCoordTexture(themeName);
  const tiles = [];
  for (let sq=0; sq<64; sq++) {
    const [x,,z]=worldOf(sq);
    const dark=(fileOf(sq)+rankOf(sq))%2===0;
    const lit = lastMove && (sq===lastMove.from||sq===lastMove.to);
    tiles.push(
      <mesh key={sq} geometry={GEO.tile} position={[x,-0.028,z]}
            onClick={(e)=>{e.stopPropagation(); onSquare(sq);}}
            onPointerOver={(e)=>{e.stopPropagation(); onTileHover && onTileHover(sq);}}>
        <meshStandardMaterial color={dark?COL.tileD:COL.tileL} roughness={0.95} metalness={0.03}
          emissive={selSq===sq?COL.accent:lit?'#c79418':'#000'}
          emissiveIntensity={selSq===sq?0.30:lit?0.18:0} />
      </mesh>);
  }
  return (
    <group>
      <mesh position={[0,-0.18,0]}>
        <boxGeometry args={[9.5,0.28,9.5]} />
        <meshStandardMaterial color={COL.frame} roughness={0.98} />
      </mesh>
      {/* must sit above the frame's top face (y = −0.04) or the labels vanish inside it */}
      <mesh rotation={[-Math.PI/2,0,0]} position={[0,-0.028,0]} raycast={noPick} renderOrder={1}>
        <planeGeometry args={[9.5,9.5]} />
        <meshBasicMaterial map={coord} transparent depthWrite={false} />
      </mesh>
      {tiles}
      {hints.map(h=>{
        const [x,,z]=worldOf(h.to);
        return (
          <mesh key={'h'+h.to} rotation={[-Math.PI/2,0,0]} position={[x,0.011,z]} renderOrder={3}
                onClick={(e)=>{e.stopPropagation(); onSquare(h.to);}}>
            {h.capture!=null ? <ringGeometry args={[0.33,0.42,30]} /> : <circleGeometry args={[0.115,20]} />}
            <meshBasicMaterial color={h.capture!=null?COL.red:COL.accent} transparent
              opacity={h.capture!=null?0.85:0.55} depthWrite={false} />
          </mesh>);
      })}
    </group>);
}
