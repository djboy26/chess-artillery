# Safety net: if the factory pushes a claude/* branch but could not open a pull
# request itself, open one so the human always has something to review.
# Title and summary come from the last commit message.
name: auto-pr
on:
  push:
    branches: ['claude/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a pull request if this branch has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then echo "PR #$EXISTING is already open for $BRANCH"; exit 0; fi
          TITLE="$(git log -1 --format=%s)"
          BODY="$(git log -1 --format=%b)"
          if [ -z "$BODY" ]; then BODY="The factory pushed this branch without a summary. Read the commits before merging."; fi
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
