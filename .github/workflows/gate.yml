# The same gate that runs on your PC, run by GitHub on every proposed change.
# Runs on every pushed branch, so every pull request from this repository carries
# exactly one gate result. A red gate blocks merging (branch protection requires it).
name: gate
on:
  push:
    branches: ['**']
jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Chess-rules fuzz + balance drift guard
        run: node gate.cjs --force
